# IR-2026-09-05: per-address limits for the static web and admin console (per web replica). Behind Caddy
# (compose.tls.yml) or the k8s edge the peer is a private proxy address: take the client from X-Forwarded-For.
limit_req_zone $binary_remote_addr zone=web_static:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=web_conn:10m;
map $status $web_retry_after {
  429 1;
  default '';
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # An SPA load fetches dozens of assets at once.
  limit_req zone=web_static burst=100 nodelay;
  limit_conn web_conn 64;
  limit_req_status 429;
  limit_conn_status 429;

  # Per-request nonce for the styles MUI/Emotion inject: the CSP never needs 'unsafe-inline'.
  set $csp_nonce $request_id;
  sub_filter_once off;
  sub_filter '__NONCE__' $csp_nonce;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* https:; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; style-src 'self' 'nonce-$csp_nonce'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Retry-After $web_retry_after always;
  # HSTS is added where TLS terminates (Caddy, or the k8s edge behind the ALB), not on this plain-HTTP port.

  # expires (not add_header) keeps the server-level security headers above on these locations.
  location = /index.html { expires epoch; }
  # Push service worker (ADR 0010): always revalidated so an update reaches every browser.
  location = /sw.js { expires epoch; }
  location ~* \.json$ { expires epoch; }
  # Admin console (apps/admin-console): every API call it makes is NIP-98 signed and checked by the
  # policy-engine admin allowlist; restrict /admin/ at the edge too if the network allows it.
  location = /admin { absolute_redirect off; return 301 /admin/; }
  location = /admin/index.html { expires epoch; }
  location /admin/ { try_files $uri /admin/index.html; }
  location / { try_files $uri /index.html; }
}
