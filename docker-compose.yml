# Sovereign / self-hosted stack (spec §4.1):
#   cp .env.example .env && $EDITOR .env && docker compose up -d
# Optional profiles: --profile tor (Tor SOCKS + onion relay), --profile managed (custodial managed signer).
name: sedecim-nostr

x-service: &service
  build:
    context: .
    target: service
  restart: unless-stopped
  networks: [nostr]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]

services:
  relay:
    # Buzz early-release relay, pinned by digest (infra/buzz/PIN). NIP-01/29/42, Blossom at /media.
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz@sha256:da30acf8ee124967a1d12b235fd2e21fab908a2452d551e1f3ec92fb1b599a07}
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      RELAY_URL: ${RELAY_URL:-ws://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://seaweedfs:8333
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${S3_BUCKET:-buzz-media}
      BUZZ_MEDIA_BASE_URL: ${BUZZ_MEDIA_BASE_URL:-http://localhost:3000/media}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:?set BUZZ_RELAY_PRIVATE_KEY}
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY:-}
      # Third-party Nostr clients (our SDK, web SaaS) authenticate with NIP-42 only.
      BUZZ_REQUIRE_AUTH_TOKEN: ${BUZZ_REQUIRE_AUTH_TOKEN:-false}
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: ${BUZZ_REQUIRE_RELAY_MEMBERSHIP:-false}
      BUZZ_PUBKEY_ALLOWLIST: ${BUZZ_PUBKEY_ALLOWLIST:-false}
      BUZZ_PUSH_ENABLED: "false"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET:?set BUZZ_GIT_HOOK_HMAC_SECRET}
      BUZZ_CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
    ports: ["${RELAY_PORT:-3000}:3000"]
    volumes: [relay-git:/data/git]
    # The runtime image has bash but no curl: probe /_readiness over /dev/tcp (same as upstream compose).
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [nostr]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PLATFORM_DB: ${PLATFORM_DB:-sedecim}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/01-platform-db.sh:/docker-entrypoint-initdb.d/01-platform-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    restart: unless-stopped
    networks: [nostr]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [nostr]

  # S3-compatible object store for Buzz media. MinIO no longer publishes pullable images, so the
  # stack uses SeaweedFS (Apache-2.0), pinned by digest. Credentials come from .env (alphanumeric).
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882} # 4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        case "$$S3_ACCESS_KEY$$S3_SECRET_KEY" in *[!A-Za-z0-9]*) echo "S3 keys must be alphanumeric"; exit 1;; esac
        umask 077
        printf '{"identities":[{"name":"buzz","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: [seaweedfs-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      retries: 24
    restart: unless-stopped
    networks: [nostr]

  seaweedfs-init:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882}
    depends_on: { seaweedfs: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for i in $$(seq 1 30); do
          if echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333 2>&1 | grep -Eq "created bucket|already exists"; then echo "bucket $$S3_BUCKET ready"; exit 0; fi
          sleep 2
        done
        echo "could not create bucket $$S3_BUCKET"; exit 1
    environment:
      S3_BUCKET: ${S3_BUCKET:-buzz-media}
    restart: "no"
    networks: [nostr]

  indexer:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: indexer } }
    environment:
      INDEXER_RELAYS: ws://relay:3000
      # Buzz maps the Host header to a community and checks the NIP-42 relay tag against it: present the public URL.
      INDEXER_RELAY_PUBLIC_URL: ${RELAY_URL:-ws://localhost:3000}
      # NIP-42 service identity of the mirror (Buzz refuses anonymous REQs). Allowlist its npub on private relays.
      INDEXER_NSEC: ${INDEXER_NSEC:-}
      INDEXER_CHANNEL_REFRESH_MS: ${INDEXER_CHANNEL_REFRESH_MS:-30000}
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      MIRROR_AT_REST_KEY: ${MIRROR_AT_REST_KEY:-}
      INDEXER_REQUIRE_AUTH: ${INDEXER_REQUIRE_AUTH:-true}
      PUBLIC_BASE_URL: ${INDEXER_PUBLIC_URL:-http://localhost:8081}
      PORT: "8081"
    ports: ["${INDEXER_PORT:-8081}:8081"]
    depends_on:
      relay: { condition: service_healthy }
      postgres: { condition: service_healthy }

  identity-service:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: identity-service } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      PUBLIC_BASE_URL: ${IDENTITY_PUBLIC_URL:-http://localhost:8082}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      # SaaS mode (ADR 0008): the Acceso user pool whose logins can be attached to accounts.
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      PORT: "8082"
    ports: ["${IDENTITY_PORT:-8082}:8082"]
    depends_on: [postgres]

  policy-engine:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: policy-engine } }
    environment:
      POLICY_ADMIN_PUBKEYS: ${POLICY_ADMIN_PUBKEYS:-}
      POLICY_SERVICE_TOKENS: ${POLICY_SERVICE_TOKENS:-}
      PUBLIC_BASE_URL: ${POLICY_PUBLIC_URL:-http://localhost:8083}
      PORT: "8083"
    ports: ["${POLICY_PORT:-8083}:8083"]

  # Secondary relay for Marmot/MLS groups (kinds 30443/445/10051 are rejected by the pinned Buzz build)
  # and for Sovereign Tor personas via its onion service. NIP-42 required; gift wraps only to recipients.
  secure-relay:
    image: ${SECURE_RELAY_IMAGE:-scsibug/nostr-rs-relay@sha256:03f54bfbffff80a50db62c9287913bd25a2dec08033b56d2122bc2550363d5c5}
    volumes:
      - ./infra/secure-relay/config.toml:/usr/src/app/config.toml:ro
      - secure-relay-data:/usr/src/app/db
    ports: ["${SECURE_RELAY_PORT:-7000}:8080"]
    restart: unless-stopped
    networks: [nostr]

  # Content-agnostic Blossom for client-encrypted attachments (Buzz /media only accepts images/video).
  blob-store:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: blob-store } }
    environment:
      BLOB_DIR: /data/blobs
      PUBLIC_BASE_URL: ${BLOB_PUBLIC_URL:-http://localhost:8085}
      BLOB_ALLOWED_PUBKEYS: ${BLOB_ALLOWED_PUBKEYS:-}
      BLOB_MAX_BYTES: ${BLOB_MAX_BYTES:-52428800}
      PORT: "8085"
    read_only: false
    volumes: [blob-data:/data]
    ports: ["${BLOB_PORT:-8085}:8085"]

  web:
    build: { context: ., target: web }
    ports: ["${WEB_PORT:-8080}:8080"]
    volumes:
      # flags generated from the interop gate: npx tsx scripts/interop-flags.ts interop-report.json
      - ./infra/web/flags.json:/usr/share/nginx/html/flags.json:ro
      # deployment settings (mode self-hosted | saas, relays, Cognito): infra/web/config.saas.example.json
      - ${WEB_CONFIG:-./infra/web/config.json}:/usr/share/nginx/html/config.json:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    networks: [nostr]

  # --- optional: custodial managed signing (explicit opt-in, spec §8.4)
  managed-signer:
    <<: *service
    profiles: [managed]
    build: { context: ., target: service, args: { SERVICE: managed-signer } }
    environment:
      # Key registry and usage log (FR005-03); migrations run at startup.
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      # Vault: local (envelope files under /data/vault, KEK below) or aws (Secrets Manager + KMS, DEC-09).
      MANAGED_SIGNER_VAULT: ${MANAGED_SIGNER_VAULT:-local}
      MANAGED_SIGNER_KEK: ${MANAGED_SIGNER_KEK:-}
      MANAGED_SIGNER_VAULT_DIR: /data/vault
      MANAGED_SIGNER_KMS_KEY_ID: ${MANAGED_SIGNER_KMS_KEY_ID:-}
      MANAGED_SIGNER_SECRET_PREFIX: ${MANAGED_SIGNER_SECRET_PREFIX:-acceso-nostr/managed-keys/}
      MANAGED_SIGNER_AWS_ENDPOINT: ${MANAGED_SIGNER_AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Prefer an instance/task IAM role; static keys only where no role is available (never the host's).
      AWS_ACCESS_KEY_ID: ${MANAGED_SIGNER_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${MANAGED_SIGNER_AWS_SECRET_ACCESS_KEY:-}
      # DEC-09: deleted keys' material is destroyed after 30 days; the usage log is kept 12 months.
      MANAGED_SIGNER_RETENTION_DAYS: ${MANAGED_SIGNER_RETENTION_DAYS:-30}
      MANAGED_SIGNER_USAGE_RETENTION_MONTHS: ${MANAGED_SIGNER_USAGE_RETENTION_MONTHS:-12}
      # End users authorize with their Acceso (Cognito) token (FR005-04), same pool as identity-service.
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Legacy service-to-service mode (token:principal + x-account-id). Empty = disabled.
      MANAGED_SIGNER_SERVICE_TOKENS: ${MANAGED_SIGNER_SERVICE_TOKENS:-}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      PORT: "8084"
    read_only: false
    volumes: [managed-vault:/data]
    # The web calls it directly with the user's Acceso token.
    ports: ["${MANAGED_SIGNER_PORT:-8084}:8084"]
    depends_on:
      postgres: { condition: service_healthy }

  # --- optional: Sovereign Tor Mode (SOCKS for clients + onion service for the relay)
  tor:
    profiles: [tor]
    build: { context: ./infra/tor }
    volumes: [tor-data:/var/lib/tor]
    ports: ["127.0.0.1:${TOR_SOCKS_PORT:-9050}:9050"]
    depends_on: [relay]
    restart: unless-stopped
    networks: [nostr]

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  relay-git:
  managed-vault:
  blob-data:
  secure-relay-data:
  tor-data:

networks:
  nostr:
    driver: bridge
