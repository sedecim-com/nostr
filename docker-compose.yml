# Sovereign / self-hosted stack (spec §4.1):
#   cp .env.example .env && $EDITOR .env && docker compose up -d
# Optional profiles: --profile tor (Tor SOCKS + onion relay), --profile managed (custodial managed signer),
#   --profile push (opaque Web Push notification gateway, ADR 0010),
#   --profile institutional (relay allowlist sync from the policy-engine, docs/institutional.md).
name: sedecim-nostr

x-service: &service
  build:
    context: .
    target: service
  restart: unless-stopped
  networks: [nostr]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]

services:
  relay:
    # Buzz early-release relay, pinned by digest (infra/buzz/PIN). NIP-01/29/42, Blossom at /media.
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz@sha256:b2cf08fd73d30e63f88832dde50d6f5f0df26e8c3ed63b133371f8ae4247d479}
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      RELAY_URL: ${RELAY_URL:-ws://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://seaweedfs:8333
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${S3_BUCKET:-buzz-media}
      BUZZ_MEDIA_BASE_URL: ${BUZZ_MEDIA_BASE_URL:-http://localhost:3000/media}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:?set BUZZ_RELAY_PRIVATE_KEY}
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY:-}
      # Deployment operators (hex, comma-separated): may create communities, e.g. for the relay .onion
      # host (scripts/buzz-provision-community.ts). Empty disables provisioning.
      RELAY_OPERATOR_PUBKEYS: ${RELAY_OPERATOR_PUBKEYS:-}
      # Origin the operator NIP-98 `u` tag is checked against (e.g. http://localhost:3000); empty rejects.
      RELAY_OPERATOR_API_ORIGIN: ${RELAY_OPERATOR_API_ORIGIN:-}
      # Third-party Nostr clients (our SDK, web SaaS) authenticate with NIP-42 only.
      BUZZ_REQUIRE_AUTH_TOKEN: ${BUZZ_REQUIRE_AUTH_TOKEN:-false}
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: ${BUZZ_REQUIRE_RELAY_MEMBERSHIP:-false}
      BUZZ_PUBKEY_ALLOWLIST: ${BUZZ_PUBKEY_ALLOWLIST:-false}
      BUZZ_PUSH_ENABLED: "false"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET:?set BUZZ_GIT_HOOK_HMAC_SECRET}
      BUZZ_CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
    ports: ["${RELAY_PORT:-3000}:3000"]
    volumes: [relay-git:/data/git]
    # The runtime image has bash but no curl: probe /_readiness over /dev/tcp (same as upstream compose).
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    restart: unless-stopped
    networks: [nostr]

  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PLATFORM_DB: ${PLATFORM_DB:-sedecim}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/01-platform-db.sh:/docker-entrypoint-initdb.d/01-platform-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    restart: unless-stopped
    networks: [nostr]

  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [nostr]

  # S3-compatible object store for Buzz media. MinIO no longer publishes pullable images, so the
  # stack uses SeaweedFS (Apache-2.0), pinned by digest. Credentials come from .env (alphanumeric).
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882}
    entrypoint: ["/bin/sh", "-c"]
    # IR-2026-10-12: only the S3 API (8333) is on the network. The master, volume and filer bind to 127.0.0.1, so no
    # container on the compose network reaches the unauthenticated filer/master (the PoC deleted envelopes through the
    # filer). Buzz is scoped to its own bucket (no global Admin), so its keys cannot touch the vault's bucket either.
    command:
      - |
        set -eu
        case "$$S3_ACCESS_KEY$$S3_SECRET_KEY$$VAULT_S3_ACCESS_KEY$$VAULT_S3_SECRET_KEY" in *[!A-Za-z0-9]*) echo "S3 keys must be alphanumeric"; exit 1;; esac
        for b in "$$S3_BUCKET" "$$VAULT_S3_BUCKET"; do case "$$b" in *[!a-z0-9-]* | '') echo "S3_BUCKET / VAULT_S3_BUCKET: lowercase letters, digits and -"; exit 1;; esac; done
        umask 077
        # Buzz reaches only its media bucket; the Continuity Vault (VAULT-06) only its own, with keys of its own.
        printf '{"identities":[{"name":"buzz","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s","Tagging:%s"]},{"name":"continuity-vault","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$VAULT_S3_ACCESS_KEY" "$$VAULT_S3_SECRET_KEY" "$$VAULT_S3_BUCKET" "$$VAULT_S3_BUCKET" "$$VAULT_S3_BUCKET" > /tmp/s3.json
        # Buckets are created from inside the container, against the local master, because only S3 is on the network.
        (
          for i in $$(seq 1 60); do
            ok=1
            for bucket in "$$S3_BUCKET" "$$VAULT_S3_BUCKET"; do
              echo "s3.bucket.create -name $$bucket" | weed shell -master=127.0.0.1:9333 2>&1 | grep -Eq "created bucket|already exists" || ok=
            done
            [ -n "$$ok" ] && { echo "buckets ready" > /tmp/buckets-ready; break; }
            sleep 2
          done
        ) &
        exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0 -s3.port.iceberg=0 -s3.port.lance=0 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-buzz-media}
      VAULT_S3_ACCESS_KEY: ${VAULT_S3_ACCESS_KEY:?set VAULT_S3_ACCESS_KEY (sh scripts/init-env.sh generates it)}
      VAULT_S3_SECRET_KEY: ${VAULT_S3_SECRET_KEY:?set VAULT_S3_SECRET_KEY (sh scripts/init-env.sh generates it)}
      VAULT_S3_BUCKET: ${VAULT_S3_BUCKET:-continuity-vault}
    volumes: [seaweedfs-data:/data]
    # Healthy only once both buckets exist, so the dependents below wait for them (there is no init service now).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && [ -f /tmp/buckets-ready ]"]
      interval: 5s
      retries: 24
    restart: unless-stopped
    networks: [nostr]

  indexer:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: indexer } }
    environment: &indexer-env
      INDEXER_RELAYS: ws://relay:3000
      # NFR005-01: replicas sharing DATABASE_URL split relays/channels (heartbeats + checkpoints in Postgres).
      INDEXER_REPLICA_ID: indexer-1
      INDEXER_HEARTBEAT_MS: ${INDEXER_HEARTBEAT_MS:-5000}
      INDEXER_OVERLAP_SECONDS: ${INDEXER_OVERLAP_SECONDS:-900}
      # Buzz maps the Host header to a community and checks the NIP-42 relay tag against it: present the public URL.
      INDEXER_RELAY_PUBLIC_URL: ${RELAY_URL:-ws://localhost:3000}
      # NIP-42 service identity of the mirror (Buzz refuses anonymous REQs). Allowlist its npub on private relays.
      INDEXER_NSEC: ${INDEXER_NSEC:-}
      INDEXER_CHANNEL_REFRESH_MS: ${INDEXER_CHANNEL_REFRESH_MS:-30000}
      # FR014-05: relay keys whose NIP-29 lists grant reading a channel (hex or npub, comma separated). Empty: the
      # NIP-11 `self` of each relay (Buzz advertises it because BUZZ_RELAY_PRIVATE_KEY is set).
      INDEXER_GROUP_AUTHORITIES: ${INDEXER_GROUP_AUTHORITIES:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      MIRROR_AT_REST_KEY: ${MIRROR_AT_REST_KEY:-}
      INDEXER_REQUIRE_AUTH: ${INDEXER_REQUIRE_AUTH:-true}
      # IR-2026-09-05: read bucket per address and reader (perMinute[:burst]; empty = 600:300). The load
      # test raises it: its lag poller reads ~10 times per second from one address.
      RATE_LIMIT_READ: ${INDEXER_RATE_LIMIT_READ:-}
      # Institutional mode (FR023-05/08): reads evaluated by the policy-engine and retention enforced on the
      # mirror. Set both (the token must be in POLICY_SERVICE_TOKENS as <token>:indexer); empty URL keeps it off.
      POLICY_ENGINE_URL: ${INDEXER_POLICY_ENGINE_URL:-}
      POLICY_ENGINE_TOKEN: ${INDEXER_POLICY_ENGINE_TOKEN:-}
      INDEXER_POLICY_WORKSPACE: ${INDEXER_POLICY_WORKSPACE:-}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
      PUBLIC_BASE_URL: ${INDEXER_PUBLIC_URL:-http://localhost:8081}
      # FR014-04: the web asks for unread counts and search from the browser.
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      PORT: "8081"
      # NFR004-01: Prometheus exporter (internal port, not published). ACK probe off unless set (ms).
      METRICS_PORT: "9464"
      TELEMETRY_LEVEL: ${INDEXER_TELEMETRY_LEVEL:-standard}
      # NFR007-02: fraction of requests traced (0..1, 0 = off), one log line per span; never at TELEMETRY_LEVEL=none.
      TRACE_SAMPLE_RATE: ${TRACE_SAMPLE_RATE:-0}
      RELAY_REGIONS: ${RELAY_REGIONS:-}
      RELAY_DEFAULT_REGION: ${RELAY_DEFAULT_REGION:-local}
      ACK_PROBE_INTERVAL_MS: ${ACK_PROBE_INTERVAL_MS:-0}
    ports: ["${INDEXER_PORT:-8081}:8081"]
    depends_on:
      relay: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # NFR005-01: second mirror replica over the same database (`docker compose --profile scale up -d`).
  indexer-2:
    <<: *service
    profiles: [scale]
    build: { context: ., target: service, args: { SERVICE: indexer } }
    environment:
      <<: *indexer-env
      INDEXER_REPLICA_ID: indexer-2
      # NIP-98 `u` tags are checked against the URL this replica is reached at.
      PUBLIC_BASE_URL: ${INDEXER_2_PUBLIC_URL:-http://localhost:8091}
    ports: ["${INDEXER_2_PORT:-8091}:8081"]
    depends_on:
      relay: { condition: service_healthy }
      postgres: { condition: service_healthy }

  identity-service:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: identity-service } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      PUBLIC_BASE_URL: ${IDENTITY_PUBLIC_URL:-http://localhost:8082}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      # SaaS mode (ADR 0008): the Acceso user pool whose logins can be attached to accounts.
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      PORT: "8082"
    ports: ["${IDENTITY_PORT:-8082}:8082"]
    depends_on: [postgres]

  policy-engine:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: policy-engine } }
    environment:
      POLICY_ADMIN_PUBKEYS: ${POLICY_ADMIN_PUBKEYS:-}
      POLICY_SERVICE_TOKENS: ${POLICY_SERVICE_TOKENS:-}
      # IR-2026-10-01: what principals other than indexer, relay-allowlist and rotation-worker may call.
      POLICY_SERVICE_SCOPES: ${POLICY_SERVICE_SCOPES:-}
      # FR023-03: subjects, devices, sessions, rotations and audit persist in policy_* tables.
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      PUBLIC_BASE_URL: ${POLICY_PUBLIC_URL:-http://localhost:8083}
      # The admin console and device passkey registration (WebAuthn RP = the web origin) run in the browser.
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      WEBAUTHN_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_REQUIRE_ATTESTATION: ${WEBAUTHN_REQUIRE_ATTESTATION:-false}
      # FR023-12: days the access decisions are kept (resources under legal hold excepted).
      ACCESS_LOG_RETENTION_DAYS: ${POLICY_ACCESS_LOG_RETENTION_DAYS:-90}
      PORT: "8083"
    ports: ["${POLICY_PORT:-8083}:8083"]
    depends_on:
      postgres: { condition: service_healthy }

  # Secondary relay for Marmot/MLS groups (kinds 30443/445/10051 are rejected by the pinned Buzz build)
  # and for Sovereign Tor personas via its onion service. NIP-42 required; gift wraps only to recipients.
  secure-relay:
    image: ${SECURE_RELAY_IMAGE:-scsibug/nostr-rs-relay:0.10.0@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d}
    volumes:
      # Institutional mode: ./infra/secure-relay/config.institutional.toml (event admission by relay-allowlist).
      - ${SECURE_RELAY_CONFIG:-./infra/secure-relay/config.toml}:/usr/src/app/config.toml:ro
      - secure-relay-data:/usr/src/app/db
    ports: ["${SECURE_RELAY_PORT:-7000}:8080"]
    restart: unless-stopped
    networks: [nostr]

  # Continuity Vault (ADR 0011, VAULT-06): envelopes sealed on each device, in a SeaweedFS bucket of their own; their
  # metadata in the platform database. The operator sees accounts, sizes and times, never content or keys.
  continuity-vault:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: continuity-vault } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      VAULT_S3_ENDPOINT: http://seaweedfs:8333
      VAULT_S3_BUCKET: ${VAULT_S3_BUCKET:-continuity-vault}
      VAULT_S3_ACCESS_KEY: ${VAULT_S3_ACCESS_KEY:?set VAULT_S3_ACCESS_KEY (sh scripts/init-env.sh generates it)}
      VAULT_S3_SECRET_KEY: ${VAULT_S3_SECRET_KEY:?set VAULT_S3_SECRET_KEY (sh scripts/init-env.sh generates it)}
      PUBLIC_BASE_URL: ${VAULT_PUBLIC_URL:-http://localhost:8088}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      # Who may open an account: open (any Nostr key), allowlist (VAULT_ALLOWED_PUBKEYS) or off (Acceso logins only).
      VAULT_NIP98: ${VAULT_NIP98:-open}
      VAULT_ALLOWED_PUBKEYS: ${VAULT_ALLOWED_PUBKEYS:-}
      # VAULT-05: the most days an archive is kept since its last write (empty: until deleted).
      VAULT_RETENTION_DAYS: ${VAULT_RETENTION_DAYS:-}
      PORT: "8088"
    ports: ["${VAULT_PORT:-8088}:8088"]
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  # Content-agnostic Blossom for client-encrypted attachments (Buzz /media only accepts images/video).
  blob-store:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: blob-store } }
    environment:
      BLOB_DIR: /data/blobs
      PUBLIC_BASE_URL: ${BLOB_PUBLIC_URL:-http://localhost:8085}
      BLOB_ALLOWED_PUBKEYS: ${BLOB_ALLOWED_PUBKEYS:-}
      BLOB_MAX_BYTES: ${BLOB_MAX_BYTES:-52428800}
      PORT: "8085"
    read_only: false
    volumes: [blob-data:/data]
    ports: ["${BLOB_PORT:-8085}:8085"]

  web:
    build: { context: ., target: web }
    ports: ["${WEB_PORT:-8080}:8080"]
    volumes:
      # flags generated from the interop gate: npx tsx scripts/interop-flags.ts interop-report.json
      - ./infra/web/flags.json:/usr/share/nginx/html/flags.json:ro
      # deployment settings (mode self-hosted | saas, relays, Cognito): infra/web/config.saas.example.json
      - ${WEB_CONFIG:-./infra/web/config.json}:/usr/share/nginx/html/config.json:ro
      # admin console at /admin/ (policyEngineUrl, identityServiceUrl): infra/web/admin-config.json
      - ${WEB_ADMIN_CONFIG:-./infra/web/admin-config.json}:/usr/share/nginx/html/admin/config.json:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    networks: [nostr]

  # --- optional: custodial managed signing (explicit opt-in, spec §8.4)
  managed-signer:
    <<: *service
    profiles: [managed]
    build: { context: ., target: service, args: { SERVICE: managed-signer } }
    environment:
      # Key registry and usage log (FR005-03); migrations run at startup.
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DB:-sedecim}
      # Vault: local (envelope files under /data/vault, KEK below) or aws (Secrets Manager + KMS, DEC-09).
      MANAGED_SIGNER_VAULT: ${MANAGED_SIGNER_VAULT:-local}
      MANAGED_SIGNER_KEK: ${MANAGED_SIGNER_KEK:-}
      MANAGED_SIGNER_VAULT_DIR: /data/vault
      MANAGED_SIGNER_KMS_KEY_ID: ${MANAGED_SIGNER_KMS_KEY_ID:-}
      MANAGED_SIGNER_SECRET_PREFIX: ${MANAGED_SIGNER_SECRET_PREFIX:-acceso-nostr/managed-keys/}
      MANAGED_SIGNER_AWS_ENDPOINT: ${MANAGED_SIGNER_AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Prefer an instance/task IAM role; static keys only where no role is available (never the host's).
      AWS_ACCESS_KEY_ID: ${MANAGED_SIGNER_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${MANAGED_SIGNER_AWS_SECRET_ACCESS_KEY:-}
      # DEC-09: deleted keys' material is destroyed after 30 days; the usage log is kept 12 months.
      MANAGED_SIGNER_RETENTION_DAYS: ${MANAGED_SIGNER_RETENTION_DAYS:-30}
      MANAGED_SIGNER_USAGE_RETENTION_MONTHS: ${MANAGED_SIGNER_USAGE_RETENTION_MONTHS:-12}
      # End users authorize with their Acceso (Cognito) token (FR005-04), same pool as identity-service.
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # FR024-03: token:principal allowed to call POST /v1/devices/:id/revoke (rotation worker / policy side).
      MANAGED_SIGNER_REVOCATION_TOKENS: ${MANAGED_SIGNER_REVOCATION_TOKENS:-}
      # true: key operations only through device-bound sessions (POST /v1/device-sessions).
      MANAGED_SIGNER_REQUIRE_DEVICE_SESSION: ${MANAGED_SIGNER_REQUIRE_DEVICE_SESSION:-false}
      # IR-2026-10-03: export, migration, deletion, cancellation and closing the other sessions take a recent sign-in.
      MANAGED_SIGNER_REAUTH_MAX_AGE_S: ${MANAGED_SIGNER_REAUTH_MAX_AGE_S:-300}
      # FR005-06: per-key / per-kind limits per minute (and per-kind overrides kind:perMin[:burst]).
      MANAGED_SIGNER_RATE_PER_KEY: ${MANAGED_SIGNER_RATE_PER_KEY:-120}
      MANAGED_SIGNER_RATE_PER_KIND: ${MANAGED_SIGNER_RATE_PER_KIND:-60}
      MANAGED_SIGNER_RATE_KINDS: ${MANAGED_SIGNER_RATE_KINDS:-}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      PORT: "8084"
      # Prometheus metrics (internal port, not published): operations, 429s, device revocations.
      METRICS_PORT: "9464"
      # NFR007-02: fraction of requests traced (0..1, 0 = off), one log line per span.
      TRACE_SAMPLE_RATE: ${TRACE_SAMPLE_RATE:-0}
    read_only: false
    volumes: [managed-vault:/data]
    # The web calls it directly with the user's Acceso token.
    ports: ["${MANAGED_SIGNER_PORT:-8084}:8084"]
    depends_on:
      postgres: { condition: service_healthy }

  # --- optional: opaque push notifications (ADR 0010). Never used by sovereign/Tor personas (refused). OPS-06: it only
  # accepts registrations on relays where its canary shows it can see activity without reading DMs; Buzz and the
  # secure relay deliver gift wraps only to their recipient, so with the reference relays it registers nothing.
  notification-gateway:
    <<: *service
    profiles: [push]
    build: { context: ., target: service, args: { SERVICE: notification-gateway } }
    environment:
      # `public=dial` pairs: the public relay URL personas use, and where the gateway reaches it.
      NOTIFY_RELAYS: ${NOTIFY_RELAYS:-ws://localhost:3000=ws://relay:3000}
      # VAPID key (base64url, 32 bytes). Empty: ephemeral key, browsers re-subscribe after each restart.
      NOTIFY_VAPID_PRIVATE_KEY: ${NOTIFY_VAPID_PRIVATE_KEY:-}
      NOTIFY_VAPID_SUBJECT: ${NOTIFY_VAPID_SUBJECT:-mailto:admin@localhost}
      # NIP-42 identity used to watch gift wraps (kind 1059 #p). Empty: ephemeral.
      NOTIFY_NSEC: ${NOTIFY_NSEC:-}
      NOTIFY_MAX_SUBSCRIPTIONS: ${NOTIFY_MAX_SUBSCRIPTIONS:-10000}
      # OPS-06: how often (ms) it re-checks with its canary which relays it can watch. Default 6 h.
      NOTIFY_PROBE_INTERVAL_MS: ${NOTIFY_PROBE_INTERVAL_MS:-21600000}
      PUBLIC_BASE_URL: ${NOTIFY_PUBLIC_URL:-http://localhost:8086}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      PORT: "8086"
    ports: ["${NOTIFY_PORT:-8086}:8086"]
    depends_on:
      relay: { condition: service_healthy }

  # --- optional: institutional relay allowlist (FR023-04). Polls GET /v1/relay/allowlist and applies it to
  # Buzz (pubkey_allowlist table; needs BUZZ_PUBKEY_ALLOWLIST=true) and to the secure-relay (gRPC admission).
  relay-allowlist:
    <<: *service
    profiles: [institutional]
    build: { context: ., target: service, args: { SERVICE: policy-engine } }
    command: ["sh", "-c", "exec node_modules/.bin/tsx services/policy-engine/src/allowlist-sync-main.ts"]
    environment:
      POLICY_ENGINE_URL: http://policy-engine:8083
      # One of the tokens in POLICY_SERVICE_TOKENS.
      POLICY_ENGINE_TOKEN: ${RELAY_ALLOWLIST_POLICY_TOKEN:-}
      BUZZ_DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      # Buzz community hosts to manage (comma separated); empty = every active community.
      BUZZ_ALLOWLIST_HOSTS: ${BUZZ_ALLOWLIST_HOSTS:-}
      # Service identities that must keep relay access (indexer, notification gateway), hex.
      ALLOWLIST_EXTRA_PUBKEYS: ${ALLOWLIST_EXTRA_PUBKEYS:-}
      ALLOWLIST_SYNC_INTERVAL_MS: ${ALLOWLIST_SYNC_INTERVAL_MS:-30000}
      ALLOWLIST_GRPC_PORT: "50051"
      # FR023-10: NIP-29 membership of the channels registered in the policy-engine, on Buzz (empty key: off). The identity
      # must be an owner or admin of each registered private channel. Buzz is reached at relay:3000 with its public URL.
      BUZZ_MEMBERSHIP_NSEC: ${BUZZ_MEMBERSHIP_NSEC:-}
      BUZZ_MEMBERSHIP_RELAY: ${RELAY_URL:-ws://localhost:3000}=ws://relay:3000
      BUZZ_MEMBERSHIP_RELAY_KEY: ${BUZZ_MEMBERSHIP_RELAY_KEY:-}
      PORT: "8087"
    depends_on:
      postgres: { condition: service_healthy }
      policy-engine: { condition: service_started }

  # --- optional: institutional rotation worker (FR024-02/04/05). Its identity joins the groups that list it as an admin
  # and invite it, removes the members the policy-engine revokes, and propagates device revocations to the managed-signer.
  # It can decrypt those groups while it is in them (it keeps no messages): docs/institutional.md, «Worker de rotaciones».
  # One replica only: the MLS state in the volume has a single writer.
  rotation-worker:
    <<: *service
    profiles: [institutional]
    build: { context: ., target: service, args: { SERVICE: rotation-worker } }
    environment:
      ROTATION_WORKER_NSEC: ${ROTATION_WORKER_NSEC:-}
      # `public=dial`: the URL clients use for the secure relay (web config secureRelays), and where the worker reaches it.
      ROTATION_WORKER_RELAYS: ${ROTATION_WORKER_RELAYS:-ws://localhost:7000=ws://secure-relay:8080}
      POLICY_ENGINE_URL: http://policy-engine:8083
      # One of the tokens in POLICY_SERVICE_TOKENS: rotations and revocations are read with it (not a policy admin).
      POLICY_ENGINE_TOKEN: ${ROTATION_WORKER_POLICY_TOKEN:-}
      ROTATION_STATE_DIR: /data
      ROTATION_STATE_KEY: ${ROTATION_STATE_KEY:-}
      ROTATION_INTERVAL_MS: ${ROTATION_INTERVAL_MS:-15000}
      # Device revocations to the managed-signer (--profile managed): one of MANAGED_SIGNER_REVOCATION_TOKENS. Empty = off.
      ROTATION_MANAGED_SIGNER_URL: ${ROTATION_MANAGED_SIGNER_URL:-}
      ROTATION_MANAGED_SIGNER_TOKEN: ${ROTATION_MANAGED_SIGNER_TOKEN:-}
      PORT: "8089"
    volumes: [rotation-state:/data]
    depends_on:
      policy-engine: { condition: service_started }
      secure-relay: { condition: service_started }

  # --- optional: Sovereign Tor Mode (SOCKS for clients + onion services for the relays)
  tor:
    profiles: [tor]
    build: { context: ./infra/tor }
    # onion-names: only the onion hostnames (the keys stay in tor-data), read by secure-relay-onion.
    volumes: [tor-data:/var/lib/tor, onion-names:/var/lib/onion-names]
    ports: ["127.0.0.1:${TOR_SOCKS_PORT:-9050}:9050"]
    # Tor resolves the onion targets when it starts: they must be running (secure-relay-onion waits for Tor).
    depends_on: [relay, secure-relay-onion]
    restart: unless-stopped
    networks: [nostr]

  # The secure relay behind its onion service, as its own instance (FR025-11): nostr-rs-relay accepts a NIP-42
  # AUTH only for the host of its relay_url, which here must be the onion. It renders relay_url from the
  # hostname Tor publishes. Its own data, as Buzz gives the onion host its own community; no host port.
  secure-relay-onion:
    profiles: [tor]
    image: ${SECURE_RELAY_IMAGE:-scsibug/nostr-rs-relay:0.10.0@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d}
    entrypoint: ["/bin/sh", "/usr/local/bin/onion-entrypoint.sh"]
    volumes:
      - ${SECURE_RELAY_CONFIG:-./infra/secure-relay/config.toml}:/etc/secure-relay/config.toml:ro
      - ./infra/secure-relay/onion-entrypoint.sh:/usr/local/bin/onion-entrypoint.sh:ro
      - onion-names:/var/lib/onion-names:ro
      - secure-relay-onion-data:/usr/src/app/db
    restart: unless-stopped
    networks: [nostr]

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  relay-git:
  managed-vault:
  blob-data:
  secure-relay-data:
  tor-data:
  onion-names:
  secure-relay-onion-data:
  rotation-state:

networks:
  nostr:
    driver: bridge
