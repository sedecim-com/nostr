name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Try a candidate upstream Buzz image against the full stack (ADR 0003).
  workflow_dispatch:
    inputs:
      buzz_image:
        description: Candidate Buzz image pinned by digest (ghcr.io/block/buzz@sha256:...)
        required: false
  # Reused by buzz-upstream.yml (BUZZ-05): same stack + interop gate against a candidate image.
  workflow_call:
    inputs:
      buzz_image:
        description: Candidate Buzz image pinned by digest
        type: string
        required: false
      stack_only:
        description: Run only the stack + interop gate job
        type: boolean
        default: false

permissions:
  contents: read

env:
  # gitleaks CLI (MIT): repository scan (`secrets`) and service logs scan (`stack`, NFR006-03).
  GITLEAKS_VERSION: 8.28.0
  # OPS-13: sha256 of gitleaks_8.28.0_linux_x64.tar.gz (gitleaks_8.28.0_checksums.txt of the release).
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  test:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: sedecim
          POSTGRES_PASSWORD: sedecim
          POSTGRES_DB: sedecim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sedecim" --health-interval 5s --health-timeout 5s --health-retries 10
      # AWS Secrets Manager + KMS emulator for the managed-signer vault tests (FR005-02).
      moto:
        image: motoserver/moto:5.2.3@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
        ports: ["5055:5000"]
    env:
      TEST_DATABASE_URL: postgres://sedecim:sedecim@localhost:5432/sedecim_test
      MOTO_ENDPOINT: http://localhost:5055
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # OPS-13: known vulnerabilities stop the build: high or above in what ships, critical in the tooling.
      - name: npm audit (high in production dependencies, critical in all)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - run: npm run typecheck
      - name: Backlog is valid and generated files are up to date
        run: node scripts/backlog.mjs --check
      - name: Disclosure copy under review is versioned and up to date (FR028-02)
        run: npx tsx scripts/disclosures.ts --check
      - name: Maturity table of the README and the release notes template is the catalog (PANEL-07)
        run: npx tsx scripts/maturity.ts --check
      - name: Wait for moto
        run: curl -sf --retry 15 --retry-delay 2 --retry-connrefused -o /dev/null "$MOTO_ENDPOINT/moto-api/"
      - name: No absolute privacy claims in user-facing copy (FR028-03)
        run: npm run lint:claims
      - run: npm test
      - name: Browser E2E (web SaaS)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Offline key generator bundle + checksum
        run: node apps/key-generator/build.mjs
      - name: Air-gapped HTML key generator + checksum, E2E from file:// with network blocked (FR003-05)
        run: |
          node apps/key-generator/build-html.mjs
          npm run test:keygen-html
      - name: SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            apps/key-generator/dist/keygen.mjs
            apps/key-generator/dist/keygen.mjs.sha256
            apps/key-generator/dist/keygen.html
            apps/key-generator/dist/keygen.html.sha256
            sbom.cdx.json

  secrets:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scanning (blocks CI, NFR-006)
        # gitleaks CLI (MIT) directly: the gitleaks-action requires a paid license for organizations.
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

  # OPS-18 (PRD GC-F03): the requirements traceability and the status board are generated from the backlog (GitHub
  # Issues) and the tests, and every file, test, commit and ADR the evidence of a task cites must exist. The full
  # history is needed to find the commits.
  traceability:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Traceability and status board are up to date and their evidence exists (OPS-18)
        run: node scripts/traceability.mjs --check

  compose:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker compose (all profiles, TLS override)
        run: |
          sh scripts/init-env.sh
          docker compose --profile tor --profile managed --profile push --profile institutional config -q
          # FR023-13: institutional mode, with the secure relay admitting events through relay-allowlist.
          SECURE_RELAY_CONFIG=./infra/secure-relay/config.institutional.toml docker compose --profile institutional config -q
          DOMAIN=example.org sh scripts/render-tls-config.sh
          DOMAIN=example.org ACME_EMAIL=ops@example.org docker compose -f docker-compose.yml -f compose.tls.yml config -q
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=example.org -e ACME_EMAIL=ops@example.org -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # NFR001-01 / NFR001-02: Kubernetes manifests, Terraform module and SLO rules are valid (no cluster, no AWS).
  deploy-config:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.5.0
      # OPS-13: sha256 of prometheus-3.5.0.linux-amd64.tar.gz (sha256sums.txt of the release).
      PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Render the stage overlay
        run: kubectl kustomize deploy/k8s/overlays/stage > /dev/null
      # FR023-13: no overlay uses the institutional component yet; it is rendered on top of the base.
      - name: Render the base with the institutional component (FR023-13)
        run: |
          dir="$RUNNER_TEMP/institutional"
          mkdir -p "$dir"
          k8s=$(realpath --relative-to="$dir" deploy/k8s)
          printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nnamespace: acceso-nostr\nresources:\n  - %s/base\ncomponents:\n  - %s/components/institutional\n' "$k8s" "$k8s" > "$dir/kustomization.yaml"
          kubectl kustomize "$dir" | grep -q 'event_admission_server = "http://relay-allowlist:50051"'
      # OPS-20: managed, the enclave and push only in the production configuration with their evidence
      # (deploy/production-gates.json); release.yml runs the same check on the tag.
      - name: Production feature gates
        run: node scripts/release-gate.mjs config
      - name: Deploy scripts
        run: shellcheck -x deploy/k8s/scripts/*.sh scripts/backup.sh scripts/restore.sh scripts/scan-logs.sh scripts/leak-test.sh scripts/tor-profile-check.sh scripts/marmot-upstream.sh scripts/rds-failover-test.sh scripts/build-image.sh scripts/image-diff.sh scripts/image-sbom.sh scripts/rebuild-image.sh scripts/verify-release.sh scripts/stack-profiles.sh scripts/wait-stack.sh
      - name: SLO rules and their unit tests (promtool)
        run: |
          curl -sSfL -o prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tgz" | sha256sum -c -
          tar -xzf prometheus.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          ./promtool check config deploy/monitoring/prometheus/prometheus.yml
          ./promtool check rules deploy/monitoring/prometheus/rules/*.rules.yml
          ./promtool test rules deploy/monitoring/prometheus/tests/*.test.yml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive deploy/terraform
          terraform -chdir=deploy/terraform/examples/stage init -backend=false -input=false
          terraform -chdir=deploy/terraform/examples/stage validate

  # FR025-04: mixed Marmot group marmot-ts <-> MDK (Rust Marmot Development Kit) through a websocket relay,
  # creator on each side, messages both ways. interop/mdk-harness pins MDK in Cargo.lock and its toolchain
  # in rust-toolchain.toml (the runner's rustup installs it). Known incompatibilities are asserted and
  # listed in interop-mdk-report.json (docs/marmot.md).
  marmot-mdk:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            interop/mdk-harness/target/
          key: mdk-harness-${{ runner.os }}-${{ hashFiles('interop/mdk-harness/Cargo.lock', 'interop/mdk-harness/rust-toolchain.toml') }}
          restore-keys: mdk-harness-${{ runner.os }}-
      - name: Build the MDK harness
        working-directory: interop/mdk-harness
        run: cargo build --release --locked
      - name: marmot-ts <-> MDK interop
        env:
          MDK_INTEROP_REQUIRED: "1"
        run: npx vitest run tests/interop/marmot-mdk.interop.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: marmot-mdk-report
          path: interop-mdk-report.json

  # FR020-03 / FR022-02: the real sovereign CLI in a network namespace, every frame captured with tcpdump.
  # Tor profile: zero DNS, zero IPv6, nothing but the SOCKS proxy; direct profile: only the persona's
  # relays; negative controls prove the capture detects each leak. SOCKS side: local stub (docs/sovereign-tor.md).
  leak-tests:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install tcpdump
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tcpdump
      - name: Leak tests with network capture (netns + pcap)
        env:
          LEAK_REQUIRE_IPV6: "1"
        run: bash scripts/leak-test.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: leak-results
          path: leak-results/

  # FR021-02: compose `tor` profile for real: onion services of relay and secure-relay, reached by the
  # sovereign CLI through the compose SOCKS port (publish + read on each .onion). Tor bootstrap on hosted
  # runners takes ~30-90 s; the script waits up to 7 min per stage and prints the tor log on failure.
  tor-profile:
    if: ${{ !inputs.stack_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compose tor profile end to end (relay + secure-relay .onion)
        run: bash scripts/tor-profile-check.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tor-profile-results
          path: tor-profile-results/
      - name: Stop stack
        if: always()
        run: docker compose --profile tor down -v

  # OPS-01 / FR-014 / FR-017 / FR-018: build every image, start the whole stack and run the interop gate
  # against the pinned Buzz relay, the secure relay (Marmot), the mirror and the blob store.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure stack
        env:
          CANDIDATE_BUZZ_IMAGE: ${{ inputs.buzz_image }}
        run: |
          sh scripts/init-env.sh
          # NFR006-04: the optional profiles (managed, push, institutional, tor) run too, so their logs are scanned.
          sh scripts/stack-profiles.sh configure
          echo "INDEXER_CHANNEL_REFRESH_MS=2000" >> .env
          if [ -n "$CANDIDATE_BUZZ_IMAGE" ]; then
            case "$CANDIDATE_BUZZ_IMAGE" in *@sha256:*) ;; *) echo "buzz_image must be pinned by digest"; exit 1;; esac
            echo "BUZZ_IMAGE=$CANDIDATE_BUZZ_IMAGE" >> .env
          fi
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for services
        run: sh scripts/wait-stack.sh
      - name: Interop gate against the running stack
        env:
          BUZZ_RELAY_URL: ws://localhost:3000
          MARMOT_RELAY_URL: ws://localhost:7000
          STACK_INDEXER_URL: http://localhost:8081
          STACK_BLOB_URL: http://localhost:8085
          STACK_VAULT_URL: http://localhost:8088
          STACK_WEB_URL: http://localhost:8080
        run: npx vitest run tests/interop
      - name: Deployment flags match the gate result (FR-017)
        run: npx tsx scripts/interop-flags.ts interop-report.json --check
      - name: Web against Buzz in the browser (FR015-03)
        env:
          BUZZ_RELAY_URL: ws://localhost:3000
          STACK_WEB_URL: http://localhost:8080
        run: |
          npx playwright install --with-deps chromium
          npx tsx tests/browser/web-buzz.e2e.ts
      # FR025-11: groups in the browser with the real secure relay (nostr-rs-relay drops gift wraps silently for
      # connections that did not authenticate). The CLI side runs in the interop gate above.
      - name: Web groups against the real secure relay (FR025-11)
        env:
          MARMOT_RELAY_URL: ws://localhost:7000
        run: |
          npm run build:web
          npx tsx tests/browser/web-groups.e2e.ts
      # OPS-06: the interop gate above shows the notification gateway cannot observe Buzz or the secure relay. Here the
      # same pinned nostr-rs-relay with nip42_dms off, the kind of relay it can observe: canary seen, DM → opaque push.
      - name: Notification gateway on nostr-rs-relay without DM gating (OPS-06)
        env:
          OPEN_RELAY_URL: ws://localhost:7010
        run: |
          sed -e 's/^port = 8080$/port = 7010/' -e 's#^relay_url = .*#relay_url = "ws://localhost:7010/"#' \
            -e 's/^nip42_auth = true$/nip42_auth = false/' -e 's/^nip42_dms = true$/nip42_dms = false/' \
            infra/secure-relay/config.toml > "$RUNNER_TEMP/open-relay.toml"
          grep -q '^port = 7010$' "$RUNNER_TEMP/open-relay.toml" && grep -q '^nip42_dms = false$' "$RUNNER_TEMP/open-relay.toml"
          docker run -d --name open-relay --network host -v "$RUNNER_TEMP/open-relay.toml:/usr/src/app/config.toml:ro" "$(docker compose config --images secure-relay)"
          timeout 60 sh -c 'until curl -sf -H "Accept: application/nostr+json" http://localhost:7010 > /dev/null; do sleep 1; done'
          npx vitest run tests/interop/notification-gateway.interop.test.ts
      # FR023-13: institutional mode end to end on the same stack. The secure relay restarts with nauthz event admission
      # by relay-allowlist (infra/secure-relay/config.institutional.toml); the checks above used the open one.
      - name: Institutional mode on the running stack (FR023-13)
        env:
          INSTITUTIONAL_RELAY_URL: ws://localhost:7000
          STACK_POLICY_URL: http://localhost:8083
        run: |
          SECURE_RELAY_CONFIG=./infra/secure-relay/config.institutional.toml docker compose up -d secure-relay
          timeout 60 sh -c 'until curl -sf -H "Accept: application/nostr+json" http://localhost:7000 > /dev/null; do sleep 1; done'
          POLICY_ADMIN_SECRET_KEY=$(sed -n 's/^POLICY_ADMIN_SECRET_KEY=//p' .env) npx vitest run tests/interop/institutional.interop.test.ts
      # NFR006-04: a request carrying a canary credential to each service; the scan below checks nobody logs it.
      - name: Canary requests to the services (NFR006-04)
        run: sh scripts/stack-profiles.sh exercise
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - name: Every service of the stack, optional profiles included, is in the log (NFR006-04)
        if: always()
        run: sh scripts/stack-profiles.sh logged compose.log
      # NFR006-03: the logs of the whole stack must not contain secrets. gitleaks (repository rules, no git)
      # plus a canary: every secret init-env.sh generated into .env is a known value that must not appear.
      - name: Scan service logs for secrets (NFR006-03)
        if: always()
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          GITLEAKS="$PWD/gitleaks" sh scripts/scan-logs.sh compose.log .env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interop-reports
          path: |
            interop-report.json
            interop-marmot-report.json
            compose.log
      - name: Stop stack
        if: always()
        run: docker compose down -v
