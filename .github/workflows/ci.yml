name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sedecim
          POSTGRES_PASSWORD: sedecim
          POSTGRES_DB: sedecim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sedecim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sedecim:sedecim@localhost:5432/sedecim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Browser E2E (web SaaS)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Offline key generator bundle + checksum
        run: node apps/key-generator/build.mjs
      - name: SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            apps/key-generator/dist/keygen.mjs
            apps/key-generator/dist/keygen.mjs.sha256
            sbom.cdx.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (blocks CI, NFR-006)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose (all profiles)
        run: |
          sh scripts/init-env.sh
          docker compose --profile tor --profile managed config -q
      - name: Build service and web images
        run: docker compose build indexer web
