name: buzz-upstream

# BUZZ-05 (ADR 0003): monthly review of the upstream Buzz image. If ghcr.io/block/buzz:main points to a
# new digest, run the same stack + interop gate as ci.yml against it and, if it passes, open the pin PR;
# if it fails, open an issue for the manual review ADR 0003 asks for.
on:
  schedule:
    # Mondays; detect only proceeds on the first Monday of the month (cron ORs day-of-month and
    # day-of-week, so "1-7 * 1" would also fire every Monday).
    - cron: '23 6 * * 1'
  workflow_dispatch:
  # A change to the review itself runs it once on main (also how the first run happens after merging).
  push:
    branches: [main]
    paths:
      - .github/workflows/buzz-upstream.yml
      - scripts/buzz-upstream.sh

permissions:
  contents: read

concurrency:
  group: buzz-upstream
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      image: ${{ steps.check.outputs.image }}
      pinned: ${{ steps.check.outputs.pinned }}
      revision: ${{ steps.check.outputs.revision }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the upstream digest and compare it with infra/buzz/PIN
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$(date -u +%d)" -gt 7 ]; then
            echo "not the first Monday of the month: skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sh scripts/buzz-upstream.sh check | tee -a "$GITHUB_OUTPUT"

  # Same job as CI (build, docker compose up, tests/interop, flags check) with BUZZ_IMAGE = candidate.
  gate:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      buzz_image: ${{ needs.detect.outputs.image }}
      stack_only: true

  # IR-2026-10-06: npm runs in a job without any write credential. It installs with --ignore-scripts and only computes
  # the new pin as a patch; pin-pr, where the App token lives, runs no npm and no script of the tree.
  pin-files:
    needs: [detect, gate]
    if: needs.detect.outputs.changed == 'true' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: interop-reports
          path: gate
      # scripts/interop-flags.ts (the deployment flags carry the pinned relay commit, FR-017)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Compute the new pin
        env:
          IMAGE: ${{ needs.detect.outputs.image }}
          REVISION: ${{ needs.detect.outputs.revision }}
          DATE: ${{ needs.detect.outputs.date }}
        run: |
          short=$(printf '%s' "${IMAGE#*@sha256:}" | cut -c1-12)
          mkdir -p "$RUNNER_TEMP/pin"
          # FR017-05: keep the flags of the current pin to tell the reviewer if the NIP-17 jitter changes
          # (e.g. upstream fixed #4192 and the gate went back to the standard 2-day jitter).
          cp infra/web/flags.json "$RUNNER_TEMP/flags.before.json"
          sh scripts/buzz-upstream.sh apply "$IMAGE" "$REVISION" "$DATE"
          npx tsx scripts/interop-flags.ts gate/interop-report.json --change-from "$RUNNER_TEMP/flags.before.json" > "$RUNNER_TEMP/pin/jitter-note.txt"
          # Same check ci runs on the PR: flags.json must match the gate report for the new pin.
          npx tsx scripts/interop-flags.ts gate/interop-report.json
          npx tsx scripts/interop-flags.ts gate/interop-report.json --check
          report="docs/interop/buzz-upstream-$short-report.json"
          cp gate/interop-report.json "$report"
          git add infra/buzz/PIN docker-compose.yml deploy/k8s/base/kustomization.yaml infra/web/flags.json "$report"
          git diff --cached --binary > "$RUNNER_TEMP/pin/pin.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-pin
          path: ${{ runner.temp }}/pin
          retention-days: 7

  pin-pr:
    needs: [detect, pin-files]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # OPS-12: with the bots' GitHub App configured, the pin branch and its PR are the App's, so the PR runs ci,
      # CodeQL and dependency-review on its own. Without it, the GITHUB_TOKEN plus a dispatched ci run, as before.
      - name: Bot token (GitHub App, OPS-12)
        id: bot
        if: vars.BOT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pin branch is pushed with this token: the App's when there is one. Nothing of the tree runs here.
          token: ${{ steps.bot.outputs.token || github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buzz-pin
          path: ${{ runner.temp }}/pin
      - name: Update the pin and open the PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          # The workflow's own token for what the App may not do: dispatch ci and open the fallback issue.
          WORKFLOW_TOKEN: ${{ github.token }}
          BOT: ${{ steps.bot.outputs.token != '' }}
          IMAGE: ${{ needs.detect.outputs.image }}
          PINNED: ${{ needs.detect.outputs.pinned }}
          REVISION: ${{ needs.detect.outputs.revision }}
          DATE: ${{ needs.detect.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short=$(printf '%s' "${IMAGE#*@sha256:}" | cut -c1-12)
          branch="buzz-upstream/$short"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "branch $branch already exists: this digest already has a PR"
            exit 0
          fi
          jitter_note=$(cat "$RUNNER_TEMP/pin/jitter-note.txt")
          report="docs/interop/buzz-upstream-$short-report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git apply --index "$RUNNER_TEMP/pin/pin.patch"
          git commit -m "Pin Buzz upstream image $short (interop gate passed)"
          git push origin "$branch"
          {
            echo "Revisión mensual de Buzz upstream (BUZZ-05, ADR 0003). El gate pasó contra la imagen candidata: $RUN_URL"
            echo
            echo "- Antes: \`$PINNED\`"
            echo "- Candidata: \`$IMAGE\`"
            echo "- Commit upstream (etiqueta OCI): ${REVISION:-desconocido: actualizar BUZZ_COMMIT y BUZZ_COMMIT_DATE a mano}"
            echo "- Informe del gate: \`$report\`"
            if [ -n "$jitter_note" ]; then
              echo "- NIP-17: $jitter_note"
            else
              jitter=$(jq -r '.nip17.timestampJitterSeconds' infra/web/flags.json)
              if [ "$jitter" = 300 ]; then
                echo "- NIP-17: sin cambios (jitter 300 s del adaptador: #4192 sigue sin resolverse upstream)."
              else
                echo "- NIP-17: sin cambios (jitter $jitter s)."
              fi
            fi
            echo
            echo "Antes de fusionar (ADR 0003): revisar el changelog upstream (kinds, NIP-42 y tenant por Host, fan-out, media, límites de timestamps), confirmar que los adaptadores del SDK siguen justificados y hacer backup antes de desplegar."
          } > "$RUNNER_TEMP/body.md"
          if url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "Buzz upstream: pin $short" --body-file "$RUNNER_TEMP/body.md"); then
            echo "opened $url"
            if [ "$BOT" != true ]; then
              # PRs opened with GITHUB_TOKEN don't trigger `ci`; a workflow_dispatch does, and its checks
              # show up on the PR's head commit. A PR opened by the App runs its checks on its own.
              GH_TOKEN="$WORKFLOW_TOKEN" gh workflow run ci.yml --ref "$branch" || echo "::warning::could not dispatch ci on $branch: run it by hand"
            fi
          else
            # Without the App, "Allow GitHub Actions to create and approve pull requests" is off; with it, its
            # permissions are wrong. Leave the branch and an issue so the review is not lost.
            echo "::warning::could not open the PR; opening an issue instead"
            {
              echo "No se pudo abrir la PR automática. Sin la GitHub App de los bots: activar *Allow GitHub Actions to create and approve pull requests* en Settings → Actions → General. Con ella: revisar que tenga *Contents* y *Pull requests* en escritura."
              echo
              echo "Rama lista para la PR: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch"
              echo
              cat "$RUNNER_TEMP/body.md"
            } > "$RUNNER_TEMP/issue.md"
            GH_TOKEN="$WORKFLOW_TOKEN" gh issue create --title "Buzz upstream: pin $short pendiente de PR" --body-file "$RUNNER_TEMP/issue.md"
          fi

  # Gate failed against the candidate: no PR (ADR 0003), but leave a trace to review by hand.
  gate-failed:
    needs: [detect, gate]
    if: always() && needs.detect.outputs.changed == 'true' && needs.gate.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open (or comment on) the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.detect.outputs.image }}
          PINNED: ${{ needs.detect.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short=$(printf '%s' "${IMAGE#*@sha256:}" | cut -c1-12)
          title="Buzz upstream: el gate falla con $short"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Vuelve a fallar: $RUN_URL"
            exit 0
          fi
          {
            echo "La revisión mensual (BUZZ-05, ADR 0003) encontró una imagen nueva de Buzz y el gate (stack + interop + flags) falla contra ella: $RUN_URL"
            echo
            echo "- Fijada: \`$PINNED\`"
            echo "- Candidata: \`$IMAGE\`"
            echo
            echo "Seguimos con la imagen fijada. Revisar el changelog upstream y el informe del gate; decidir si se adapta el SDK (adaptador, nunca un fork) o se espera a otra versión."
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
