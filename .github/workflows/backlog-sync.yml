name: backlog-sync

# GitHub Issues are the source of truth of the backlog (docs/backlog/GITHUB.md). This workflow rebuilds
# docs/backlog/{backlog.json,README.md,backlog.csv}, the requirements traceability and the status board (OPS-18:
# docs/requirements-traceability.md, docs/status.md) from the issues and opens/updates one PR with the result;
# once main already matches the issues, it closes that PR and deletes its branch.
# A closed issue only becomes Hecho when its evidence cites a commit of main (OPS-17, docs/backlog/GITHUB.md).
# `seed` (create on GitHub whatever backlog.json has and the issues don't; rename milestones after meta.sprints
# and align "blocked by" links with each issue's "Depende de") runs when this workflow or the sync script change
# on main — that is how the first merge populates the issues — or on demand.
on:
  push:
    branches: [main]
    paths:
      - scripts/backlog-github.mjs
      - .github/workflows/backlog-sync.yml
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Crear en GitHub lo que falte desde backlog.json antes de sincronizar
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: backlog-sync
  cancel-in-progress: false

jobs:
  sync:
    # Issue events: only backlog tasks and epics (the daily run catches anything else, e.g. a removed label).
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'backlog') ||
      contains(github.event.issue.labels.*.name, 'epic')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      BRANCH: backlog-sync
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # OPS-18: the commits cited as evidence are checked against the history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Seed GitHub Issues from backlog.json (only what is missing; resumable)
        if: github.event_name == 'push' || inputs.seed
        run: node scripts/backlog-github.mjs seed
      - name: Rebuild the backlog from GitHub Issues
        run: |
          node scripts/backlog-github.mjs pull --write
          node scripts/backlog.mjs
          # OPS-18: its PR does not run ci, so the evidence of the issues is checked here.
          node scripts/traceability.mjs
          node scripts/traceability.mjs --check
      - name: Open, update or close the sync PR
        run: |
          base="${{ github.event.repository.default_branch }}"
          if git diff --quiet -- docs/backlog docs/requirements-traceability.md docs/status.md; then
            echo "docs/backlog already matches GitHub Issues"
            # Usually another PR brought this sync to main (docs/backlog/GITHUB.md): merging the open sync PR would
            # change nothing or conflict, and its branch is stale. The next diff recreates both from main.
            pr="$(gh pr list --head "$BRANCH" --base "$base" --state open --json number --jq '.[].number')"
            if [ -n "$pr" ]; then
              # shellcheck disable=SC2016
              gh pr close "$pr" --delete-branch \
                --comment '`main` ya coincide con GitHub Issues: esta sincronización ya no hace falta. La próxima diferencia volverá a crear la rama `backlog-sync` y abrirá una PR nueva.'
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add docs/backlog docs/requirements-traceability.md docs/status.md
          git commit -m "backlog: sync desde GitHub Issues"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --base "$base" --state open --json number --jq '.[].number')" ]; then
            echo "sync PR updated"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<'MD'
          Sincronización automática de `docs/backlog` desde GitHub Issues (label `backlog`), la fuente del backlog. Ver `docs/backlog/GITHUB.md`.

          No editar esta rama: cada cambio en los issues la regenera.
          MD
          gh pr create --base "$base" --head "$BRANCH" --title "backlog: sync desde GitHub Issues" --body-file "$RUNNER_TEMP/body.md" \
            || echo "::warning::No se pudo abrir el PR (¿\"Allow GitHub Actions to create and approve pull requests\" desactivado?). La rama $BRANCH tiene el backlog sincronizado: ${{ github.server_url }}/${{ github.repository }}/compare/$base...$BRANCH"
