name: release

# OPS-08 / NFR010-02 / FR003-06: builds the release artifacts with read-only permissions and publishes
# them from jobs that run in the protected `release` environment (required reviewers, self-review
# prevented, deployments only from `v*` tags: configured in Settings -> Environments, see
# docs/building.md). Only those jobs can push images, sign (cosign keyless) and attest (SLSA provenance,
# SBOM). Verification: scripts/verify-release.sh <tag>, docs/keygen-air-gapped.md.
on:
  push:
    tags: ['v*']
  # Re-run a release: choose the tag itself in "Use workflow from" (the signing identity is the ref the
  # workflow runs on, and the environment only accepts v* tags) and type it again below to confirm.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must be the ref selected in "Use workflow from", e.g. v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keygen HTML + CLI bundle + SBOM. No write permission and no npm cache (a release build does not
  # restore caches written by other workflows).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Release runs on a v* tag (and the dispatch input matches it)
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$REF" in refs/tags/v*) ;; *) echo "release must run on a v* tag, not $REF"; exit 1;; esac
          if [ -n "$INPUT_TAG" ] && [ "refs/tags/$INPUT_TAG" != "$REF" ]; then
            echo "input tag $INPUT_TAG does not match the selected ref $REF"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Offline key generator bundle + checksum
        run: node apps/key-generator/build.mjs
      - name: Air-gapped HTML key generator + checksum, E2E from file:// with network blocked (FR003-05)
        run: |
          node apps/key-generator/build-html.mjs
          npx playwright install --with-deps chromium
          npm run test:keygen-html
      - name: SBOM
        run: npm run sbom
      - name: Collect release files
        run: |
          mkdir -p release
          cp apps/key-generator/dist/keygen.html apps/key-generator/dist/keygen.mjs sbom.cdx.json release/
          (cd release && sha256sum -- *)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  # One image per Dockerfile target / service in docker-compose.yml, exported as an OCI archive: this job
  # cannot push; publish-images pushes exactly these bytes (the digest is checked there).
  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: indexer, context: ., target: service, service: indexer }
          - { name: identity-service, context: ., target: service, service: identity-service }
          - { name: policy-engine, context: ., target: service, service: policy-engine }
          - { name: blob-store, context: ., target: service, service: blob-store }
          - { name: managed-signer, context: ., target: service, service: managed-signer }
          - { name: notification-gateway, context: ., target: service, service: notification-gateway }
          - { name: web, context: ., target: web, service: '' }
          - { name: tor, context: infra/tor, target: '', service: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        env:
          NAME: ${{ matrix.name }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nostr-$NAME" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
          push: false
          # Provenance and SBOM are attested by publish-images (actions/attest-*), not embedded by buildx.
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=oci,dest=image.tar
      - name: Record the manifest digest
        run: |
          digest=$(tar -xOf image.tar index.json | jq -r '.manifests | if length == 1 then .[0].digest else error("expected one manifest") end')
          echo "$digest" > digest
          echo "$IMAGE@$digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: |
            image.tar
            digest
          compression-level: 0
          if-no-files-found: error

  # Push, sign and attest each image. Protected environment: needs approval from a reviewer other than
  # whoever triggered the run.
  publish-images:
    needs: [build, images]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: indexer, sbom: true }
          - { name: identity-service, sbom: true }
          - { name: policy-engine, sbom: true }
          - { name: blob-store, sbom: true }
          - { name: managed-signer, sbom: true }
          - { name: notification-gateway, sbom: true }
          - { name: web, sbom: true }
          # Alpine + tor only: the npm SBOM does not describe it.
          - { name: tor, sbom: false }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.sbom
        with:
          name: release-files
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the built image unchanged (digest must match the build job)
        id: push
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nostr-$NAME"
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          skopeo copy --preserve-digests --digestfile pushed oci-archive:image.tar "docker://$image:$TAG"
          built=$(cat digest)
          if [ "$(cat pushed)" != "$built" ]; then
            echo "pushed digest $(cat pushed) differs from built digest $built"; exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$built" >> "$GITHUB_OUTPUT"
          echo "$image@$built" > "image-$NAME.txt"
      - name: Sign by digest (cosign keyless)
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation (CycloneDX)
        if: matrix.sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: release/sbom.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pushed-${{ matrix.name }}
          path: image-${{ matrix.name }}.txt
          if-no-files-found: error

  # Sign the release files, attest them and create the GitHub Release. Same protected environment.
  publish:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pushed-*
          path: pushed
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: images.txt (image@digest) and SHA256SUMS
        working-directory: release
        run: |
          cat ../pushed/image-*.txt | sort > images.txt
          sha256sum keygen.html keygen.mjs sbom.cdx.json images.txt > SHA256SUMS
          cat images.txt SHA256SUMS
      - name: Sign every file (cosign keyless, Sigstore bundle)
        working-directory: release
        run: |
          for f in keygen.html keygen.mjs sbom.cdx.json images.txt SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/keygen.html
            release/keygen.mjs
            release/sbom.cdx.json
      - name: SBOM attestation (CycloneDX)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release/keygen.html
            release/keygen.mjs
          sbom-path: release/sbom.cdx.json
      - name: GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Verificación: \`sh scripts/verify-release.sh $TAG\` (docs/building.md)."
            echo "Generador air-gapped: docs/keygen-air-gapped.md."
            echo
            echo "Imágenes (fijadas por digest):"
            echo '```'
            cat images.txt
            echo '```'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- keygen.html keygen.mjs sbom.cdx.json images.txt SHA256SUMS ./*.sigstore.json
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md -- keygen.html keygen.mjs sbom.cdx.json images.txt SHA256SUMS ./*.sigstore.json
          fi
