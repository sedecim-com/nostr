name: release

# OPS-08 / NFR010-02 / FR003-06: builds the release artifacts with read-only permissions and publishes
# them from jobs that run in the protected `release` environment (required reviewers, self-review
# prevented, deployments only from `v*` tags: configured in Settings -> Environments, see
# docs/building.md). Only those jobs can push images, sign (cosign keyless) and attest (SLSA provenance,
# SBOM). Verification: scripts/verify-release.sh <tag>, docs/keygen-air-gapped.md.
# REL-01: the `dod` job blocks publication unless the Definition of Done holds for the tagged commit, and
# the release stays a draft until `verify` has checked what was published (docs/release-checklist.md).
# NFR010-03: images are built twice and must match (scripts/build-image.sh, scripts/rebuild-image.sh).
on:
  push:
    tags: ['v*']
  # Re-run a release: choose the tag itself in "Use workflow from" (the signing identity is the ref the
  # workflow runs on, and the environment only accepts v* tags) and type it again below to confirm.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must be the ref selected in "Use workflow from", e.g. v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keygen HTML + CLI bundle + SBOM. No write permission and no npm cache (a release build does not
  # restore caches written by other workflows).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Release runs on a v* tag (and the dispatch input matches it)
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$REF" in refs/tags/v*) ;; *) echo "release must run on a v* tag, not $REF"; exit 1;; esac
          if [ -n "$INPUT_TAG" ] && [ "refs/tags/$INPUT_TAG" != "$REF" ]; then
            echo "input tag $INPUT_TAG does not match the selected ref $REF"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Offline key generator bundle + checksum
        run: node apps/key-generator/build.mjs
      - name: Air-gapped HTML key generator + checksum, E2E from file:// with network blocked (FR003-05)
        run: |
          node apps/key-generator/build-html.mjs
          npx playwright install --with-deps chromium
          npm run test:keygen-html
      - name: SBOM
        run: npm run sbom
      - name: Collect release files
        run: |
          mkdir -p release
          cp apps/key-generator/dist/keygen.html apps/key-generator/dist/keygen.mjs sbom.cdx.json release/
          (cd release && sha256sum -- *)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  # One image per Dockerfile target / service in docker-compose.yml, exported as an OCI archive: this job
  # cannot push; publish-images pushes exactly these bytes (the digest is checked there). NFR010-03: each
  # image is built twice with scripts/build-image.sh, in two fresh builders without cache, and the release
  # stops if the digests differ, so the published digest is the one anyone rebuilds from the tag
  # (scripts/rebuild-image.sh).
  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        name: [indexer, identity-service, policy-engine, blob-store, managed-signer, notification-gateway, continuity-vault, web, tor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build twice (reproducible) and record the manifest digest
        env:
          NAME: ${{ matrix.name }}
          IMAGE_VERSION: ${{ github.ref_name }}
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nostr-$NAME"
          export IMAGE_NAME="$image:$IMAGE_VERSION"
          digest=$(sh scripts/build-image.sh "$NAME" image.tar | tail -n 1)
          again=$(sh scripts/build-image.sh "$NAME" rebuild.tar | tail -n 1)
          if [ "$digest" != "$again" ]; then
            echo "::error::nostr-$NAME is not reproducible: $digest != $again"
            sh scripts/image-diff.sh image.tar rebuild.tar
            exit 1
          fi
          echo "$digest" > digest
          echo "$image@$digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: |
            image.tar
            digest
          compression-level: 0
          if-no-files-found: error

  # REL-01 Definition of Done (docs/release-checklist.md), read-only: for this exact commit CI is green
  # (tests and browser E2E, interop gate, leak tests, tor profile…), the restore drill passed recently,
  # the SBOM exists, the security audits are done or waived by someone other than the releaser, and the
  # release notes carry the trust-model section. Nothing is published unless it passes.
  dod:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Definition of Done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: node scripts/release-gate.mjs all --tag "$TAG" --sha "$GITHUB_SHA" --sbom release/sbom.cdx.json --actor "$ACTOR" --actor "$TRIGGERING_ACTOR"

  # Push, sign and attest each image. Protected environment: needs approval from a reviewer other than
  # whoever triggered the run. Only after the Definition of Done passed.
  publish-images:
    needs: [build, images, dod]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: indexer, sbom: true }
          - { name: identity-service, sbom: true }
          - { name: policy-engine, sbom: true }
          - { name: blob-store, sbom: true }
          - { name: managed-signer, sbom: true }
          - { name: notification-gateway, sbom: true }
          - { name: continuity-vault, sbom: true }
          - { name: web, sbom: true }
          # Alpine + tor only: the npm SBOM does not describe it.
          - { name: tor, sbom: false }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.sbom
        with:
          name: release-files
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the built image unchanged (digest must match the build job)
        id: push
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nostr-$NAME"
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          skopeo copy --preserve-digests --digestfile pushed oci-archive:image.tar "docker://$image:$TAG"
          built=$(cat digest)
          if [ "$(cat pushed)" != "$built" ]; then
            echo "pushed digest $(cat pushed) differs from built digest $built"; exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$built" >> "$GITHUB_OUTPUT"
          echo "$image@$built" > "image-$NAME.txt"
      - name: Sign by digest (cosign keyless)
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation (CycloneDX)
        if: matrix.sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: release/sbom.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pushed-${{ matrix.name }}
          path: image-${{ matrix.name }}.txt
          if-no-files-found: error

  # Sign the release files, attest them and create the GitHub Release as a DRAFT (not public yet): the
  # body is docs/releases/<tag>.md (REL-02, must carry the trust-model section) plus images.txt. Same
  # protected environment. `verify` publishes the draft only after checking what was published.
  publish:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Release notes exist and carry the trust-model section (REL-02)
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-gate.mjs notes --tag "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pushed-*
          path: pushed
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: images.txt (image@digest) and SHA256SUMS
        working-directory: release
        run: |
          cat ../pushed/image-*.txt | sort > images.txt
          sha256sum keygen.html keygen.mjs sbom.cdx.json images.txt > SHA256SUMS
          cat images.txt SHA256SUMS
      - name: Sign every file (cosign keyless, Sigstore bundle)
        working-directory: release
        run: |
          for f in keygen.html keygen.mjs sbom.cdx.json images.txt SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/keygen.html
            release/keygen.mjs
            release/sbom.cdx.json
      - name: SBOM attestation (CycloneDX)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release/keygen.html
            release/keygen.mjs
          sbom-path: release/sbom.cdx.json
      - name: GitHub Release (draft)
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat "../docs/releases/$TAG.md"
            echo
            echo "## Imágenes (fijadas por digest)"
            echo
            echo '```'
            cat images.txt
            echo '```'
          } > notes.md
          files="keygen.html keygen.mjs sbom.cdx.json images.txt SHA256SUMS $(echo ./*.sigstore.json)"
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # Re-run of a release that did not finish: only a draft may be replaced.
            if [ "$draft" != true ]; then echo "release $TAG is already published; cut a new tag"; exit 1; fi
            # shellcheck disable=SC2086
            gh release upload "$TAG" --clobber -- $files
            gh release edit "$TAG" --notes-file notes.md
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md -- $files
          fi

  # REL-01: verify what was just published, as a user would (scripts/verify-release.sh: signatures,
  # checksums, attestations of the files and of every image in images.txt), and only then turn the draft
  # into a public release. If verification fails the release stays a draft (docs/release-checklist.md).
  verify:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # read the draft and publish it
      packages: read # the images may still be private right after the first release
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the draft release (scripts/verify-release.sh)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: sh scripts/verify-release.sh "$TAG" "$RUNNER_TEMP/verify"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
