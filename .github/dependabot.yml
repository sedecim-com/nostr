version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Types follow the oldest supported runtime (engines: node >=22, CI on Node 22), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  # OPS-13: the tor image, and the images of the compose stack (postgres, redis, SeaweedFS, secure relay…).
  # Buzz is pinned per ADR 0003 through buzz-upstream.yml, which runs the interop gate first; Dependabot names
  # it without its registry. A major of postgres or redis needs its data migrated and the same bump in
  # deploy/k8s, so it is a planned change, not a Dependabot PR.
  - package-ecosystem: docker
    directory: /infra/tor
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: block/buzz
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
