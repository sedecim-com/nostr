# SLO monitoring (NFR001-02, NFR004-02): blackbox probes + Prometheus rules/alerts + Alertmanager + Grafana dashboard.
# Included by deploy/k8s/overlays/stage; none of these services is exposed through the edge
# (kubectl -n acceso-nostr port-forward svc/grafana 3000). Config files are shared with docker compose.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - monitoring.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.yml
  - name: prometheus-rules
    files:
      - slo-availability.rules.yml=prometheus/rules/slo-availability.rules.yml
      - relay-latency.rules.yml=prometheus/rules/relay-latency.rules.yml
      - managed-signer.rules.yml=prometheus/rules/managed-signer.rules.yml
  - name: blackbox-config
    files:
      - blackbox.yml=blackbox/blackbox.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager/alertmanager.yml
  - name: grafana-provisioning-datasources
    files:
      - datasources.yaml=grafana/provisioning/datasources.yaml
  - name: grafana-provisioning-dashboards
    files:
      - dashboards.yaml=grafana/provisioning/dashboards.yaml
  - name: grafana-dashboards
    files:
      - slo-availability.json=grafana/dashboards/slo-availability.json
      - relay-latency.json=grafana/dashboards/relay-latency.json
# OPS-13: by digest (deploy/k8s/scripts/mirror-ecr-deps.sh copies these same digests).
images:
  # v3.5.0
  - name: prom/prometheus
    newName: prom/prometheus
    digest: sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
  # v0.27.0
  - name: prom/blackbox-exporter
    newName: prom/blackbox-exporter
    digest: sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
  # v0.28.1
  - name: prom/alertmanager
    newName: prom/alertmanager
    digest: sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
  # 12.1.1
  - name: grafana/grafana
    newName: grafana/grafana
    digest: sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
