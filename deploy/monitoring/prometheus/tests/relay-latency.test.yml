# promtool test rules deploy/monitoring/prometheus/tests/relay-latency.test.yml
rule_files:
  - ../rules/relay-latency.rules.yml

evaluation_interval: 1m

tests:
  # relay "slow" answers every ACK in (2 s, 5 s]; relay "fast" in <= 0.25 s. 10 ACKs per minute each.
  - interval: 1m
    input_series:
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="slow.example",region="eu-west-1",le="0.25"}'
        values: '0x40'
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="slow.example",region="eu-west-1",le="2"}'
        values: '0x40'
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="slow.example",region="eu-west-1",le="5"}'
        values: '0+10x40'
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="slow.example",region="eu-west-1",le="+Inf"}'
        values: '0+10x40'
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="fast.example",region="us-east-1",le="0.25"}'
        values: '0+10x40'
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="fast.example",region="us-east-1",le="2"}'
        values: '0+10x40'
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="fast.example",region="us-east-1",le="5"}'
        values: '0+10x40'
      - series: 'nostr_relay_ack_latency_seconds_bucket{job="nostr-metrics",relay="fast.example",region="us-east-1",le="+Inf"}'
        values: '0+10x40'
      - series: 'up{job="nostr-metrics",instance="indexer:9464"}'
        values: '1x40'
    promql_expr_test:
      - expr: relay:ack_latency_seconds:p95_rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'relay:ack_latency_seconds:p95_rate5m{relay="slow.example",region="eu-west-1"}'
            value: 4.85
          - labels: 'relay:ack_latency_seconds:p95_rate5m{relay="fast.example",region="us-east-1"}'
            value: 0.2375
      - expr: relay:ack_latency_seconds:p99_rate5m{relay="slow.example"}
        eval_time: 30m
        exp_samples:
          - labels: 'relay:ack_latency_seconds:p99_rate5m{relay="slow.example",region="eu-west-1"}'
            value: 4.97
    alert_rule_test:
      - eval_time: 30m
        alertname: RelayAckLatencyP95High
        exp_alerts:
          - exp_labels:
              relay: slow.example
              region: eu-west-1
              severity: ticket
              slo: ack-latency
            exp_annotations:
              summary: "slow.example (eu-west-1): P95 de ACK 4.85s (> 2s)"
              description: "El P95 de publicación→OK del relay slow.example en eu-west-1 supera 2 s desde hace 10 min. Los clientes lo muestran como degradado. Runbook: docs/slo.md#latencia."
              runbook: docs/slo.md
      # Not yet 10 minutes above the threshold: no alert.
      - eval_time: 8m
        alertname: RelayAckLatencyP95High
        exp_alerts: []
      - eval_time: 30m
        alertname: NostrMetricsMissing
        exp_alerts: []

  # Relative degradation: a day at ~0.49 s, then 2 h at ~1.95 s (below the 2 s absolute threshold).
  - interval: 1m
    input_series:
      - series: 'nostr_relay_ack_latency_seconds_bucket{relay="r.example",region="eu",le="0.25"}'
        values: '0x1560'
      - series: 'nostr_relay_ack_latency_seconds_bucket{relay="r.example",region="eu",le="0.5"}'
        values: '0+10x1440 14400x120'
      - series: 'nostr_relay_ack_latency_seconds_bucket{relay="r.example",region="eu",le="1"}'
        values: '0+10x1440 14400x120'
      - series: 'nostr_relay_ack_latency_seconds_bucket{relay="r.example",region="eu",le="2"}'
        values: '0+10x1560'
      - series: 'nostr_relay_ack_latency_seconds_bucket{relay="r.example",region="eu",le="+Inf"}'
        values: '0+10x1560'
    alert_rule_test:
      - eval_time: 1560m
        alertname: RelayAckLatencyDegraded
        exp_alerts:
          - exp_labels:
              relay: r.example
              region: eu
              severity: ticket
              slo: ack-latency
            exp_annotations:
              summary: "r.example (eu): P95 de ACK más del doble que su línea base de 1 d"
              description: "P95 (30 min) = 1.95s, más del doble del P95 del día anterior. Degradación relativa aunque no supere el umbral absoluto. Runbook: docs/slo.md#latencia."
              runbook: docs/slo.md
      - eval_time: 1560m
        alertname: RelayAckLatencyP95High
        exp_alerts: []
      # Steady day: no relative alert.
      - eval_time: 1430m
        alertname: RelayAckLatencyDegraded
        exp_alerts: []

  # Failures, stuck outbox and a dead exporter.
  - interval: 1m
    input_series:
      - series: 'nostr_relay_publish_total{job="nostr-metrics",relay="bad.example",region="eu",result="ok"}'
        values: '0+5x40'
      - series: 'nostr_relay_publish_total{job="nostr-metrics",relay="bad.example",region="eu",result="timeout"}'
        values: '0+5x40'
      - series: 'nostr_outbox_oldest_pending_age_seconds{job="nostr-metrics",service="indexer",instance="indexer:9464"}'
        values: '0+60x40'
      - series: 'up{job="nostr-metrics",instance="indexer:9464"}'
        values: '0x40'
    promql_expr_test:
      - expr: relay:publish_failures:ratio_rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'relay:publish_failures:ratio_rate5m{relay="bad.example",region="eu"}'
            value: 0.5
    alert_rule_test:
      - eval_time: 30m
        alertname: RelayPublishFailureRateHigh
        exp_alerts:
          - exp_labels:
              relay: bad.example
              region: eu
              severity: ticket
              slo: ack-latency
            exp_annotations:
              summary: "bad.example (eu): 50% de publicaciones fallidas"
              description: "Más del 25 % de las publicaciones al relay no reciben OK=true desde hace 15 min (ver nostr_relay_publish_total por result). Runbook: docs/slo.md#latencia."
              runbook: docs/slo.md
      # age passes 900 s at minute 15, alert after 10 more minutes
      - eval_time: 24m
        alertname: OutboxOldestPendingTooOld
        exp_alerts: []
      - eval_time: 30m
        alertname: OutboxOldestPendingTooOld
        exp_alerts:
          - exp_labels:
              service: indexer
              severity: ticket
              slo: ack-latency
            exp_annotations:
              summary: "indexer: la operación más antigua del outbox lleva 30m 0s sin replicarse"
              description: "Hay mensajes que no alcanzan el quorum de relays desde hace más de 15 min (ver nostr_outbox_relay_failures_total por reason). Runbook: docs/slo.md#latencia."
              runbook: docs/slo.md
      - eval_time: 30m
        alertname: NostrMetricsMissing
        exp_alerts:
          - exp_labels:
              job: nostr-metrics
              instance: indexer:9464
              severity: ticket
              slo: ack-latency
            exp_annotations:
              summary: "Exportador de métricas Nostr caído (indexer:9464)"
              description: "La latencia de ACK y el outbox no se están midiendo; revisar el servicio y METRICS_PORT."
              runbook: docs/slo.md
