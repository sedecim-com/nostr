# Acceso Nostr on Kubernetes (NFR001-01). Same services, ports and healthchecks as docker-compose.yml.
# The Secret `acceso-nostr-secrets` is NOT rendered here: deploy/k8s/scripts/generate-secret.sh builds it
# from AWS Secrets Manager (k8s/<env>/acceso-nostr) and applies it separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: acceso-nostr
labels:
  - pairs:
      app.kubernetes.io/part-of: acceso-nostr
    includeSelectors: false
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - seaweedfs.yaml
  - relay.yaml
  - secure-relay.yaml
  - indexer.yaml
  - identity-service.yaml
  - policy-engine.yaml
  - blob-store.yaml
  - web.yaml
  - edge.yaml

configMapGenerator:
  # Non-secret settings shared by every workload (envFrom). Overlays merge their public URLs here.
  - name: acceso-nostr-config
    literals:
      - POSTGRES_USER=buzz
      - POSTGRES_DB=buzz
      - PLATFORM_DB=sedecim
      # DATABASE_URL = postgres://...@$(POSTGRES_HOST):5432/<db>$(POSTGRES_URL_QUERY). In-cluster Postgres
      # here; components/rds-postgres points them at RDS with TLS verified (NFR001-03).
      - POSTGRES_HOST=postgres
      - POSTGRES_URL_QUERY=
      - S3_BUCKET=buzz-media
      - RELAY_URL=ws://relay:3000
      - BUZZ_MEDIA_BASE_URL=http://relay:3000/media
      - WEB_ORIGIN=http://web:8080
      - RELAY_OWNER_PUBKEY=
      - BUZZ_REQUIRE_AUTH_TOKEN=false
      - BUZZ_REQUIRE_RELAY_MEMBERSHIP=false
      - BUZZ_PUBKEY_ALLOWLIST=false
      - INDEXER_PUBLIC_URL=http://indexer:8081
      - INDEXER_REQUIRE_AUTH=true
      - INDEXER_CHANNEL_REFRESH_MS=30000
      # FR014-05: empty = each relay's NIP-11 `self` (Buzz advertises it with BUZZ_RELAY_PRIVATE_KEY).
      - INDEXER_GROUP_AUTHORITIES=
      - INDEXER_POLICY_ENGINE_URL=
      - IDENTITY_PUBLIC_URL=http://identity-service:8082
      - POLICY_PUBLIC_URL=http://policy-engine:8083
      - POLICY_ADMIN_PUBKEYS=
      # FR023-12: days the policy-engine keeps its access decisions (resources under legal hold excepted).
      - ACCESS_LOG_RETENTION_DAYS=90
      - BLOB_PUBLIC_URL=http://blob-store:8085
      - BLOB_ALLOWED_PUBKEYS=
      - BLOB_MAX_BYTES=52428800
      - COGNITO_REGION=us-east-1
      - COGNITO_USER_POOL_ID=
      - COGNITO_CLIENT_ID=
      - AWS_REGION=us-east-1
      # Every API is reached through the edge, which sends the client address as X-Forwarded-For:
      # the in-process rate limiters trust that one hop (IR-2026-09-05; RATE_LIMIT_* in docs).
      - RATE_LIMIT_TRUST_PROXY_HOPS=1
  - name: postgres-init
    files:
      - 01-platform-db.sh=files/01-platform-db.sh
  - name: secure-relay-config
    files:
      - config.toml=files/secure-relay.config.toml
  - name: web-config
    files:
      - config.json=files/web-config.json
  - name: web-admin-config
    files:
      - config.json=files/admin-config.json
  - name: edge-conf
    files:
      - nginx.conf=files/edge-nginx.conf
      - core-server.conf=files/core-server.conf

# Same pins as docker-compose.yml. Buzz is pinned by digest from infra/buzz/PIN (scripts/buzz-upstream.sh
# apply rewrites this digest too; tests/scripts/deploy-manifests.test.ts checks they match).
images:
  - name: buzz
    newName: ghcr.io/block/buzz
    digest: sha256:ac4521f3e464c9dd09c92de52697182257da95e62b3c723805688594257fa74e
  - name: seaweedfs
    newName: chrislusf/seaweedfs
    digest: sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
  - name: secure-relay
    newName: scsibug/nostr-rs-relay
    digest: sha256:03f54bfbffff80a50db62c9287913bd25a2dec08033b56d2122bc2550363d5c5
  # OPS-13: third-party images by digest, the same as docker-compose.yml and the Dockerfile.
  # postgres 17.11-alpine3.24
  - name: postgres
    newName: postgres
    digest: sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  # redis 7.4.11-alpine3.21
  - name: redis
    newName: redis
    digest: sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
  # nginx 1.31.6-alpine3.24 (the base of the web image, Dockerfile NGINX_IMAGE)
  - name: nginx
    newName: nginx
    digest: sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
  # Built from this repo's Dockerfile (targets `service` and `web`); overlays point them at ECR.
  - name: acceso-nostr-service
    newTag: local
  - name: acceso-nostr-web
    newTag: local
