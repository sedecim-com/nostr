# Content-agnostic Blossom for client-encrypted attachments (compose: blob-store, volume blob-data).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blob-data
  labels:
    app: blob-store
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blob-store
  labels:
    app: blob-store
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels:
      app: blob-store
  template:
    metadata:
      labels:
        app: blob-store
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blob-store
          image: acceso-nostr-service
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: acceso-nostr-config
          env:
            - name: SERVICE
              value: blob-store
            - name: PORT
              value: "8085"
            - name: BLOB_DIR
              value: /data/blobs
            - name: PUBLIC_BASE_URL
              value: $(BLOB_PUBLIC_URL)
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: blob-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: blob-store
  labels:
    app: blob-store
spec:
  selector:
    app: blob-store
  ports:
    - name: http
      port: 8085
      targetPort: 8085
