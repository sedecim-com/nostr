# Public hosts of the core stack (see nginx.conf for the naming rule). Rate limit zones and security
# headers come from nginx.conf; add_header must not be used here (it would drop the inherited ones).
server {
  listen 8080;
  server_name ~^[^.]+-relay\.;
  client_max_body_size 100m; # Buzz /media (Blossom)
  # SEC-12: this host forwards only what clients use, the WebSocket and NIP-11 at / and Blossom under /media/.
  # The other routes of Buzz (operator API, git, invites, HTTP bridge, moderation, workflows, admin...) stay
  # internal: docs/security/buzz-attack-surface.md. Anything else gets the edge's own 404, which no upstream
  # route can turn into a hit; scripts/edge-check.sh runs this file and checks it.
  location = / {
    # WebSocket handshakes and NIP-11; open sockets per address are capped.
    limit_req zone=edge_ws burst=20 nodelay;
    limit_conn edge_conn 64;
    proxy_pass http://relay:3000;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
  location = /media {
    # Without this, nginx answers /media with a redirect to /media/.
    default_type text/plain;
    return 404 'not found\n';
  }
  location /media/ {
    limit_req zone=edge_ws burst=20 nodelay;
    limit_conn edge_conn 64;
    proxy_pass http://relay:3000;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
  location / {
    default_type text/plain;
    return 404 'not found\n';
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-secure\.;
  location / {
    limit_req zone=edge_ws burst=20 nodelay;
    limit_conn edge_conn 64;
    proxy_pass http://secure-relay:8080;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-blobs\.;
  client_max_body_size 50m;
  location / {
    limit_req zone=edge_blobs burst=20 nodelay;
    limit_conn edge_conn 16;
    proxy_pass http://blob-store:8085;
    proxy_request_buffering off;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-mirror\.;
  location / {
    limit_req zone=edge_api burst=40 nodelay;
    limit_conn edge_conn 32;
    proxy_pass http://indexer:8081;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-id\.;
  location / {
    limit_req zone=edge_api burst=40 nodelay;
    limit_conn edge_conn 32;
    proxy_pass http://identity-service:8082;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-policy\.;
  location / {
    limit_req zone=edge_api burst=40 nodelay;
    limit_conn edge_conn 32;
    proxy_pass http://policy-engine:8083;
  }
}
