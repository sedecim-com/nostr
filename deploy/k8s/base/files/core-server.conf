# Public hosts of the core stack (see nginx.conf for the naming rule).
server {
  listen 8080;
  server_name ~^[^.]+-relay\.;
  client_max_body_size 100m; # Buzz /media (Blossom)
  location / {
    proxy_pass http://relay:3000;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-secure\.;
  location / {
    proxy_pass http://secure-relay:8080;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-blobs\.;
  client_max_body_size 50m;
  location / {
    proxy_pass http://blob-store:8085;
    proxy_request_buffering off;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-mirror\.;
  location / {
    proxy_pass http://indexer:8081;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-id\.;
  location / {
    proxy_pass http://identity-service:8082;
  }
}

server {
  listen 8080;
  server_name ~^[^.]+-policy\.;
  location / {
    proxy_pass http://policy-engine:8083;
  }
}
