# Edge proxy (single NodePort → ALB target group, the Sedecim pattern; see deploy/README.md).
# Each service keeps its own host (like infra/caddy/Caddyfile) so relays keep a clean WebSocket origin
# for the NIP-42 relay tag. Hosts are matched by the suffix of their first label, so one config works
# for every environment:  nostr-<env>.<domain> → web, nostr-<env>-relay.<domain> → relay, ...
# TLS ends at the ALB. Extra servers (managed-signer) are added as *-server.conf by kustomize components.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # No query strings in access logs: Blossom/NIP-98 tokens travel in headers, but be conservative.
  log_format edge '$remote_addr "$request_method $host$uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout edge;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  client_max_body_size 1m;

  # web (default server) + ALB health check
  server {
    listen 8080 default_server;
    server_name _;
    location = /_edge_health {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }
    location / {
      proxy_pass http://web:8080;
    }
  }

  include /etc/nginx/edge/*-server.conf;
}
