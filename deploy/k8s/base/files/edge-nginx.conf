# Edge proxy (single NodePort → ALB target group, the Sedecim pattern; see deploy/README.md).
# Each service keeps its own host (like infra/caddy/Caddyfile) so relays keep a clean WebSocket origin
# for the NIP-42 relay tag. Hosts are matched by the suffix of their first label, so one config works
# for every environment:  nostr-<env>.<domain> → web, nostr-<env>-relay.<domain> → relay, ...
# TLS ends at the ALB. Extra servers (managed-signer) are added as *-server.conf by kustomize components.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # No query strings in access logs: Blossom/NIP-98 tokens travel in headers, but be conservative.
  log_format edge '$remote_addr "$request_method $host$uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout edge;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Real client address (IR-2026-09-05): the ALB appends it to X-Forwarded-For. Only private hops (ALB,
  # nodes) are trusted, so the rightmost public address wins and a client cannot spoof it.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Rate limits per client address. They are per edge replica (2 in base): the effective limit is
  # replicas x rate. The services add their own buckets (RATE_LIMIT_*, per service replica).
  limit_req_zone $binary_remote_addr zone=edge_web:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=edge_api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=edge_blobs:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=edge_ws:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=edge_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;
  limit_conn_log_level warn;
  # Retry-After on the edge's own 429s (a service's 429 already carries its own).
  map "$status:$upstream_http_retry_after" $retry_after {
    '429:' 1;
    default '';
  }

  # Security headers for every host (IR-2026-09-16). TLS ends at the ALB: HSTS only on https requests.
  # Upstream copies are hidden so each header is sent once; the web keeps its CSP (frame-ancestors 'none').
  map $http_x_forwarded_proto $hsts {
    https 'max-age=31536000; includeSubDomains';
    default '';
  }
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security $hsts always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Retry-After $retry_after always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # The client resolved above, not a chain it could have prefixed (services use RATE_LIMIT_TRUST_PROXY_HOPS=1).
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  client_max_body_size 1m;

  # web (default server) + ALB health check
  server {
    listen 8080 default_server;
    server_name _;
    location = /_edge_health {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }
    location / {
      # An SPA load fetches dozens of assets at once.
      limit_req zone=edge_web burst=100 nodelay;
      limit_conn edge_conn 64;
      proxy_pass http://web:8080;
    }
  }

  include /etc/nginx/edge/*-server.conf;
}
