# Single public entry: nginx on a NodePort that the ALB target group registers (Sedecim/kops pattern:
# Service port 80 → container 8080 → nodePort, the target group listens on the nodePort).
# Overlays pin the nodePort to the one registered in Terraform (deploy/terraform, var.node_port).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx
          command: ["nginx", "-c", "/etc/nginx/edge/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/edge
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /_edge_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_edge_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: conf
          configMap:
            name: edge-conf
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    app: edge
spec:
  type: NodePort
  selector:
    app: edge
  ports:
    - name: http
      port: 80
      targetPort: 8080
