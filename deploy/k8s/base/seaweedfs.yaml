# S3-compatible store for Buzz media (same SeaweedFS pin and Buzz bootstrap as docker-compose.yml; the compose also
# creates the Continuity Vault's bucket and keys, VAULT-06: here components/continuity-vault adds them).
# IR-2026-10-12: only the S3 API (8333) is served; the master, volume and filer bind to 127.0.0.1 inside the pod, and
# a NetworkPolicy (below) admits ingress only on 8333, so no pod reaches the unauthenticated filer/master.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
---
# IR-2026-10-12: default-deny ingress to SeaweedFS except the S3 API. The internals already bind to localhost; this is
# defence in depth, and it documents that only 8333 is meant to be reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
  labels:
    app: seaweedfs
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    app: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: seaweedfs
          command: ["/bin/sh", "-c"]
          # IR-2026-10-12: Buzz is scoped to its own bucket (no global Admin); the master, volume and filer bind to
          # 127.0.0.1 and Iceberg/Lance are off, so only the S3 API is on the pod network; the bucket is created from
          # inside the pod against the local master (nothing reaches it over the network any more).
          args:
            - |
              set -eu
              case "$S3_ACCESS_KEY$S3_SECRET_KEY" in *[!A-Za-z0-9]*) echo "S3 keys must be alphanumeric"; exit 1;; esac
              case "$S3_BUCKET" in *[!a-z0-9-]* | '') echo "S3_BUCKET: lowercase letters, digits and -"; exit 1;; esac
              umask 077
              printf '{"identities":[{"name":"buzz","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s","Tagging:%s"]}]}' "$S3_ACCESS_KEY" "$S3_SECRET_KEY" "$S3_BUCKET" "$S3_BUCKET" "$S3_BUCKET" "$S3_BUCKET" > /tmp/s3.json
              (
                for i in $(seq 1 60); do
                  if echo "s3.bucket.create -name $S3_BUCKET" | weed shell -master=127.0.0.1:9333 2>&1 | grep -Eq "created bucket|already exists"; then echo ready > /tmp/buckets-ready; break; fi
                  sleep 2
                done
              ) &
              exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0 -s3.port.iceberg=0 -s3.port.lance=0 -s3.config=/tmp/s3.json
          ports:
            - name: s3
              containerPort: 8333
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: acceso-nostr-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: acceso-nostr-secrets
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: acceso-nostr-config
                  key: S3_BUCKET
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # IR-2026-10-12: the master binds to 127.0.0.1, so the probes run inside the pod (kubelet cannot reach it on
          # the pod IP any more). Ready only once the bucket exists.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && [ -f /tmp/buckets-ready ]"]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
