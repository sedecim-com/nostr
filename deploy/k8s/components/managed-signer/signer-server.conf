# The web calls the managed signer directly with the user's Acceso token (compose: managed-signer :8084).
server {
  listen 8080;
  server_name ~^[^.]+-signer\.;
  location / {
    limit_req zone=edge_api burst=40 nodelay;
    limit_conn edge_conn 32;
    proxy_pass http://managed-signer:8084;
  }
}
