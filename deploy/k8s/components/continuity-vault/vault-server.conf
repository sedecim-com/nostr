# Continuity Vault (component continuity-vault): one sealed envelope per request, 1 MiB by default
# (VAULT_MAX_ENVELOPE_BYTES).
server {
  listen 8080;
  server_name ~^[^.]+-vault\.;
  client_max_body_size 2m;
  location / {
    limit_req zone=edge_api burst=40 nodelay;
    limit_conn edge_conn 32;
    proxy_pass http://continuity-vault:8088;
  }
}
