# Secondary "secure" relay (spec §5: relay secundario / relay .onion) for traffic the pinned Buzz build
# rejects: Marmot/MLS kinds 30443 (key packages), 445 (group messages), 10051 (key package relay list).
# See docs/marmot.md. nostr-rs-relay 0.10.0 pinned by digest in docker-compose.yml.

[info]
relay_url = "wss://nostr-stage-secure.ai.acce.so/"
name = "sedecim secure relay"
description = "Marmot/MLS groups and Sovereign Tor traffic. Ciphertext only."

[database]
data_directory = "/usr/src/app/db"

[network]
address = "0.0.0.0"
port = 8080

[options]
# NIP-59 gift wraps (Welcome invites) are backdated up to 2 days; accept them.
reject_future_seconds = 1800

[limits]
# MLS commits/Welcomes that carry the ratchet tree grow with group size.
max_event_bytes = 262144
max_ws_message_bytes = 524288
max_ws_frame_bytes = 524288

[authorization]
# Require NIP-42 so kind 1059/4 are only served to their authenticated recipients.
nip42_auth = true
nip42_dms = true
