title = "sedecim-nostr"
[extend]
useDefault = true

[[rules]]
id = "nostr-nsec"
description = "Nostr secret key (nsec)"
regex = '''nsec1[02-9ac-hj-np-z]{58}'''
tags = ["key", "nostr"]

[[rules]]
id = "nostr-ncryptsec"
description = "Encrypted Nostr key (ncryptsec) should not be committed"
regex = '''ncryptsec1[02-9ac-hj-np-z]{100,}'''
tags = ["key", "nostr"]

[[allowlists]]
description = "Test fixture with a well-known throwaway key used to verify log redaction"
paths = ['''packages/telemetry-policy/test/telemetry\.test\.ts''']

[[allowlists]]
description = "Public values of the RFC 8291 worked example (section 5), used to test Web Push encryption byte for byte"
regexTarget = "match"
regexes = [
  '''BTBZMqHH6r4Tts7J_aSIgg''',
  '''yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw''',
  '''q1dXpw3UpT5VOmu_cf_v6ih07Aems3njxI-JWgLcM94''',
]

[[allowlists]]
description = "Cargo lockfiles are generated by cargo and hold only crate names, versions and checksums (e.g. libcrux-secrets)"
paths = ['''(^|/)Cargo\.lock$''']

[[allowlists]]
description = "Official NIP-44 v2 test vectors (github.com/paulmillr/nip44): public test keys, checked against the SHA-256 published in the NIP"
paths = ['''packages/nostr-core/test/vectors/nip44\.vectors\.json$''']

[[allowlists]]
description = "Kubernetes secretKeyRef/configMapKeyRef key names (e.g. VAULT_S3_SECRET_KEY): a line holding only an env-style name with underscores, never a value (mixed-case or AWS-style values are still reported)"
regexTarget = "line"
regexes = ['''(?-i)^\s*key: [A-Z][A-Z0-9]*(_[A-Z0-9]+)+\s*$''']
